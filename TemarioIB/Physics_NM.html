const DATA={"subject": "Física IB", "course": "Guía de Física IB", "defaultLevel": "NM", "fileKind": "fisica-ib-temario", "topics": [{"id": "A", "title": "Espacio, tiempo y movimiento", "subblocks": [{"id": "A.1", "title": "Cinemática", "nmHours": 9, "nsExtra": 0, "items": [{"id": "A.1.NM.1", "title": "Que el movimiento de los cuerpos a través del espacio y el tiempo se puede describir y analizar a partir de su posición, velocidad y aceleración", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.2", "title": "Que la velocidad es la razón de cambio de la posición y la aceleración es la razón de cambio de la velocidad", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.3", "title": "Que el cambio de posición es el desplazamiento", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.4", "title": "La diferencia entre distancia y desplazamiento", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.5", "title": "La diferencia entre los valores instantáneos y medios de la velocidad, la rapidez y la aceleración, y cómo determinarlos", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.6", "title": "Las ecuaciones del movimiento para resolver problemas con movimiento uniformemente acelerado, dadas por s = u + v 2 t v = u + at s = ut + 1 2 at2 v2 = u2 + 2as", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.7", "title": "El movimiento con aceleración uniforme y no uniforme", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.8", "title": "El comportamiento de los proyectiles en ausencia de resistencia de fluidos, y la aplicación de las ecuaciones del movimiento resueltas en los componentes vertical y horizontal", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "A.1.NM.9", "title": "El efecto cualitativo de la resistencia del fluido sobre los proyectiles, incluidos el tiempo de vuelo, la trayectoria, la velocidad, la aceleración, el alcance y la velocidad terminal", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}], "observations": "El enfoque cuantitativo del movimiento de proyectiles se limitará a situaciones donde la resistencia de fluidos no existe o puede ignorarse. La trayectoria del movimiento de proyectiles es parabólica en ausencia de resistencia de fluidos, pero no se requiere la ecuación de la trayectoria. Es necesario estar familiarizado con los proyectiles lanzados horizontalmente y con ángulos por encima y por debajo del plano horizontal. El movimiento de proyectiles solo aparecerá en problemas en que se utiliza un valor constante de g cerca de la superficie de la Tierra. La resistencia de fluidos se refiere a los efectos de los gases y los líquidos sobre el movimiento de un cuerpo."}, {"id": "A.2", "title": "Fuerzas y cantidad de movimiento", "nmHours": 10, "nsExtra": 0, "items": [{"id": "A.2.NM.1", "title": "Las tres leyes del movimiento de Newton", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.2", "title": "Las fuerzas como interacciones entre cuerpos", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.3", "title": "Que las fuerzas que actúan sobre un cuerpo pueden representarse en un diagrama de cuerpo libre", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.4", "title": "Que es posible analizar los diagramas de cuerpo libre para hallar la fuerza resultante sobre un sistema", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.5", "title": "La naturaleza y el uso de las siguientes fuerzas de contacto:", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.6", "title": "La fuerza normal FN que es el componente de la fuerza de contacto que actúa perpendicularmente a la superficie que sostiene el cuerpo", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.7", "title": "La fuerza de fricción superficial Ff que actúa en una dirección paralela al plano de contacto entre un cuerpo y una superficie, ya sea sobre un cuerpo en reposo de acuerdo con Ff ≤ μsFN o sobre un cuerpo en movimiento de acuerdo con Ff = μdFN, donde μs y μd son los coeficientes de fricción estática y dinámica, respectivamente", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.8", "title": "La tensión", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.9", "title": "La fuerza restauradora elástica FH que cumple la ley de Hooke dada por FH = –kx, donde k es la constante elástica", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.10", "title": "La fuerza de resistencia viscosa Fd que actúa sobre una pequeña esfera y se opone a su movimiento a través de un fluido, dada por Fd = 6πηrv, donde η es la viscosidad del fluido, r es el radio de la esfera y v es la velocidad de la esfera a través del fluido", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.11", "title": "La flotabilidad Fb que actúa sobre un cuerpo debido al desplazamiento del fluido, dada por Fb = ρVg, donde V es el volumen de fluido desplazado", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.12", "title": "La naturaleza y el uso de las siguientes fuerzas de campo:", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.13", "title": "La fuerza gravitatoria Fg es el peso del cuerpo y se calcula según Fg=mg", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.14", "title": "La fuerza eléctrica Fe", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.15", "title": "La fuerza magnética Fm", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.16", "title": "Que la cantidad de movimiento, dada por p=mv, permanece constante a menos que sobre el sistema actúe una fuerza externa resultante", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.17", "title": "Que una fuerza externa resultante aplicada sobre un sistema constituye un impulso J, dado por J=FΔt, donde F es la fuerza media resultante y Δt es el tiempo de contacto", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.18", "title": "Que el impulso externo aplicado es igual a la variación de la cantidad de movimiento del sistema", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.19", "title": "Que la segunda ley del movimiento de Newton en la forma F=ma supone que la masa es constante, mientras que F=ΔpΔt permite situaciones en las que la masa esté cambiando", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.20", "title": "Las colisiones elásticas e inelásticas entre dos cuerpos", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.21", "title": "Las explosiones", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.22", "title": "Las consideraciones energéticas en colisiones elásticas, colisiones inelásticas y explosiones", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.23", "title": "Que los cuerpos que se mueven a lo largo de una trayectoria circular a una velocidad constante experimentan una aceleración que se dirige radialmente hacia el centro de círculo, conocida como aceleración centrípeta, y dada por a = v2 r = ω 2r = 4π2r T 2", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.24", "title": "Que el movimiento circular está causado por una fuerza centrípeta que actúa en una dirección perpendicular a la velocidad", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.25", "title": "Que una fuerza centrípeta hace que el cuerpo cambie de dirección aunque la magnitud de su velocidad pueda permanecer constante", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}, {"id": "A.2.NM.26", "title": "Que el movimiento a lo largo de una trayectoria circular puede describirse a partir de la velocidad angular ω, que está relacionada con la velocidad lineal v por la ecuación v = 2πr T = ωr", "nmHours": 0.38461538461538464, "nsExtra": 0, "level": "NM"}], "observations": "Los bocetos e interpretaciones de diagramas de cuerpo libre y la determinación de la fuerza resultante solo se refieren a situaciones en una y dos dimensiones. Las fuerzas deben rotularse empleando nombres o símbolos comúnmente aceptados. La primera ley del movimiento de Newton se aplicará a problemas relacionados con el equilibrio de translación. Los ejemplos de la tercera ley del movimiento de Newton incluirán la identificación de los pares de fuerzas en diversas situaciones. No se requiere el uso de sistemas de ecuaciones que involucren la conservación de la cantidad de movimiento y la energía en las colisiones. El enfoque cuantitativo de las colisiones y explosiones se aplicará a situaciones unidimensionales para el alumnado del Nivel Medio y a situaciones bidimensionales para el alumnado del Nivel Superior. Las situaciones deben incluir movimiento circular tanto uniforme como no uniforme en planos horizontales y verticales. No se requiere el análisis de fuerzas sobre cuerpos en movimiento circular no uniforme en un plano vertical en puntos que no sean el más alto o el más bajo. No se requiere el tratamiento cuantitativo de problemas que incluyen superficies peraltadas."}, {"id": "A.3", "title": "Trabajo, energía y potencia", "nmHours": 8, "nsExtra": 0, "items": [{"id": "A.3.NM.1", "title": "El principio de conservación de la energía", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.2", "title": "Que el trabajo realizado por una fuerza es equivalente a una transferencia de energía", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.3", "title": "Que las transferencias de energía se pueden representar en un diagrama de Sankey", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.4", "title": "Que el trabajo W realizado sobre un cuerpo por una fuerza constante depende de la componente de la fuerza en la dirección del desplazamiento, de acuerdo con W = Fs cos θ", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.5", "title": "Que el trabajo realizado por la fuerza resultante sobre un sistema es igual al cambio en la energía del sistema", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.6", "title": "Que la energía mecánica es la suma de la energía cinética, la energía potencial gravitatoria y la energía potencial elástica", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.7", "title": "Que en ausencia de fuerzas resistivas de fricción se conserva la energía mecánica total de un sistema", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.8", "title": "Que si se conserva la energía mecánica, el trabajo es la cantidad de energía transformada entre las distintas formas de energía mecánica de un sistema, como por ejemplo:", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.9", "title": "La energía cinética del movimiento de traslación, dada por Ek = 1 2 mv2 = p2 2m", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.10", "title": "La energía potencial gravitatoria cerca de la superficie de la Tierra, dada por Δ Ep = mgΔ h", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.11", "title": "La energía potencial elástica, dada por EH = 1 2 k(Δ x)2", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.12", "title": "Que la potencia desarrollada P es el ritmo de variación (o velocidad) del trabajo realizado, o la velocidad de transferencia de energía, de acuerdo con P = Δ W Δ t = Fv", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.13", "title": "El rendimiento η en función de la transferencia de energía o potencia, dado por η = Esalida Eentrada = Psalida Pentrada", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}, {"id": "A.3.NM.14", "title": "La densidad de energía de las fuentes de combustible", "nmHours": 0.5714285714285714, "nsExtra": 0, "level": "NM"}], "observations": "El cambio en la energía mecánica total de un sistema debe interpretarse en función del trabajo que cualquier fuerza no conservativa realiza sobre el sistema."}, {"id": "A.4", "title": "Mecánica de los cuerpos rígidos", "nmHours": 0, "nsExtra": 7, "items": [{"id": "A.4.NM.1", "title": "El momento τ de una fuerza respecto de un eje, dado por τ = Fr sen θ", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.2", "title": "Que para los cuerpos en equilibrio rotacional el momento de fuerza resultante es cero", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.3", "title": "Que un momento de fuerza desequilibrado aplicado a un cuerpo rígido extendido causará una aceleración angular", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.4", "title": "Que la rotación de un cuerpo puede describirse en función del desplazamiento angular, la velocidad angular y la aceleración angular", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.5", "title": "Que las ecuaciones del movimiento para una aceleración angular uniforme pueden usarse a fin de predecir la posición angular θ, el desplazamiento angular Δθ, la rapidez angular ω y la aceleración angular α del cuerpo, de acuerdo con Δ θ = ω f + ω i 2 t ω f = ω i + αt Δ θ = ω it + 1 2 αt2 ω f 2 = ω i 2 + 2αΔ θ", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.6", "title": "Que el momento de inercia I depende de la distribución de masa de un cuerpo extendido alrededor de un eje de rotación", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.7", "title": "El momento de inercia de un sistema de masas puntuales, dado por I = Σmr 2", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.8", "title": "La segunda ley del movimiento de Newton para la rotación, dada por τ=Iα, donde τ es el valor promedio del momento de fuerza", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.9", "title": "Que un cuerpo extendido que rota con una rapidez angular tiene un momento angular L dado por L=Iω", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.10", "title": "Que el momento angular permanece constante a menos que sobre el cuerpo actúe un momento de fuerza resultante", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NM.11", "title": "Que la acción de un momento de fuerza resultante constituye un impulso angular ΔL dado por Δ L = τΔ t = Δ( Iω )", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.4.NS.1", "title": "El momento τ de una fuerza respecto de un eje, dado por τ = Fr sen θ", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.2", "title": "Que para los cuerpos en equilibrio rotacional el momento de fuerza resultante es cero", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.3", "title": "Que un momento de fuerza desequilibrado aplicado a un cuerpo rígido extendido causará una aceleración angular", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.4", "title": "Que la rotación de un cuerpo puede describirse en función del desplazamiento angular, la velocidad angular y la aceleración angular", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.5", "title": "Que las ecuaciones del movimiento para una aceleración angular uniforme pueden usarse a fin de predecir la posición angular θ, el desplazamiento angular Δθ, la rapidez angular ω y la aceleración angular α del cuerpo, de acuerdo con Δ θ = ω f + ω i 2 t ω f = ω i + αt Δ θ = ω it + 1 2 αt2 ω f 2 = ω i 2 + 2αΔ θ", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.6", "title": "Que el momento de inercia I depende de la distribución de masa de un cuerpo extendido alrededor de un eje de rotación", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.7", "title": "El momento de inercia de un sistema de masas puntuales, dado por I = Σmr 2", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.8", "title": "La segunda ley del movimiento de Newton para la rotación, dada por τ=Iα, donde τ es el valor promedio del momento de fuerza", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.9", "title": "Que un cuerpo extendido que rota con una rapidez angular tiene un momento angular L dado por L=Iω", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.10", "title": "Que el momento angular permanece constante a menos que sobre el cuerpo actúe un momento de fuerza resultante", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}, {"id": "A.4.NS.11", "title": "Que la acción de un momento de fuerza resultante constituye un impulso angular ΔL dado por Δ L = τΔ t = Δ( Iω )", "nmHours": 0, "nsExtra": 0.6363636363636364, "level": "NS"}], "observations": "No es necesario abordar la naturaleza vectorial del momento de fuerza y del momento angular, pero se debe incluir el sentido (igual o contrario al de las agujas del reloj) de un momento de fuerza. No se requiere calcular el centro de masa de los cuerpos; debe comprenderse que, al considerar el movimiento lineal, se puede asumir que la masa de un cuerpo extendido está concentrada en el centro de masa. Cuando sea necesario, se proporcionará la ecuación para el momento de inercia de una distribución de masa concreta. El movimiento simultáneo de rotación y traslación se limitará a los cuerpos que ruedan sin deslizarse. Se usará la rapidez angular en vez de realizar un análisis vectorial formal basado en la velocidad angular. Se usará el término velocidad angular a pesar de que no se requiera un tratamiento vectorial formal. Las situaciones deben incluir cambios del momento de inercia en cuerpos extendidos y pares de cuerpos acoplados."}, {"id": "A.5", "title": "Relatividad galileana y especial", "nmHours": 0, "nsExtra": 8, "items": [{"id": "A.5.NM.1", "title": "Los sistemas de referencia", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.2", "title": "Que las leyes del movimiento de Newton son las mismas en todos los sistemas de referencia inerciales y esto se conoce como relatividad galileana", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.3", "title": "Que en la relatividad galileana la posición x′ y el tiempo t′ de un suceso vienen dados por x′ = x–vt y t′ =t", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.4", "title": "Que las ecuaciones de transformación galileana conducen a la ecuación para la suma de velocidades, dada por u′ = u–v", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.5", "title": "Los dos postulados de la relatividad especial", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.6", "title": "Que los postulados de la relatividad especial conducen a las ecuaciones de transformación de Lorentz para las coordenadas de un suceso en dos sistemas de referencia inerciales, dadas por x′ = γ(x–vt) t′ = γ t–vx c2 donde γ = 1 1–v2 c2", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.7", "title": "Que las ecuaciones de transformación de Lorentz conducen a la ecuación para la suma de velocidades relativistas, dada por u′ = u–v 1–uv c2", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.8", "title": "Que el intervalo de espacio-tiempo Δs entre dos sucesos es una cantidad invariante dada por (Δ s)2 = (cΔ t)2–(Δ x)2", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.9", "title": "El intervalo de tiempo propio y la longitud propia", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.10", "title": "La dilatación temporal, dada por Δ t = γΔ t0", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.11", "title": "La contracción de longitudes, dada por L=L0γ", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.12", "title": "La relatividad de la simultaneidad", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.13", "title": "Los diagramas de espacio-tiempo", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.14", "title": "Que el ángulo entre la línea de universo de una partícula en movimiento y el eje temporal en un diagrama de espacio-tiempo está relacionado con la velocidad de la partícula, de acuerdo con tan θ = v c", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NM.15", "title": "Que los experimentos de desintegración de muones pueden proporcionar pruebas experimentales de la dilatación temporal y la contracción de longitudes", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "A.5.NS.1", "title": "Contenido adicional del NS: Relatividad galileana y especial", "nmHours": 0, "nsExtra": 8.0, "level": "NS"}], "observations": "Un sistema de referencia inercial no está acelerado. No se requiere la derivación de las ecuaciones de transformación de Lorentz ni de las ecuaciones para la suma de velocidades relativistas. No se requiere la derivación de las ecuaciones de dilatación temporal y de contracción de longitudes. El eje temporal de los diagramas de espacio-tiempo se debe rotular como ct. La discusión de las líneas de universo de partículas en movimiento se limitará al caso de velocidad constante. La dilatación temporal, la contracción de longitudes y la simultaneidad se pueden visualizar mediante diagramas de espacio-tiempo. Las escalas en los ejes temporales ct y ct′ y en los ejes espaciales x y x′ de dos sistemas de referencia inerciales que se mueven el uno respecto al otro no son iguales, y están definidas por líneas de intervalo de espacio-tiempo constante."}]}, {"id": "B", "title": "La naturaleza corpuscular de la materia", "subblocks": [{"id": "B.1", "title": "Transferencias de energía térmica", "nmHours": 6, "nsExtra": 0, "items": [{"id": "B.1.NM.1", "title": "La teoría molecular de los sólidos, líquidos y gases", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.2", "title": "La densidad ρ, dada por ρ=mV", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.3", "title": "Que las escalas Kelvin y Celsius se usan para expresar la temperatura", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.4", "title": "Que el cambio de temperatura de un sistema es el mismo al expresarlo en las escalas Kelvin y Celsius", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.5", "title": "Que la temperatura Kelvin es una medida de la energía cinética promedio de las partículas, de acuerdo con Ek = 3 2 kBT", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.6", "title": "Que la energía interna de un sistema es la suma de la energía potencial intermolecular total, que surge de las fuerzas entre las moléculas, y la energía cinética aleatoria total de las moléculas, que surge de su movimiento aleatorio", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.7", "title": "Que la diferencia de temperatura determina el sentido de la transferencia de energía térmica resultante entre los cuerpos", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.8", "title": "Que un cambio de fase representa un cambio en el comportamiento de las partículas, que surge de una variación de energía a temperatura constante", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.9", "title": "El análisis cuantitativo de las transferencias de energía térmica Q mediante el calor específico c y el calor latente específico de fusión y vaporización de sustancias L, de acuerdo con Q = mcΔ T y Q=mL", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.10", "title": "Que la conducción, la convección y la radiación térmica son los principales mecanismos de transferencia de energía térmica", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.11", "title": "La conducción en función de la diferencia en la energía cinética de las partículas", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.12", "title": "El análisis cuantitativo de la velocidad de transferencia de energía térmica por conducción en función del tipo de material, el área de la sección transversal del material y el gradiente de temperatura, de acuerdo con Δ Q Δ t = kA Δ T Δ x", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.13", "title": "La descripción cualitativa de la energía térmica transferida por convección debido a las diferencias en la densidad del fluido", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.14", "title": "El análisis cuantitativo de la energía transferida por radiación como resultado de la emisión de ondas electromagnéticas desde la superficie de un cuerpo, que en el caso de un cuerpo negro se puede modelizar mediante la ley de Stefan-Boltzmann, dada por L = σAT 4, donde L es la luminosidad del cuerpo, A es su superficie y T es su temperatura absoluta", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.15", "title": "El concepto de brillo aparente b", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.16", "title": "La luminosidad L de un cuerpo, dada por b = L 4πd2", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}, {"id": "B.1.NM.17", "title": "El espectro de emisión de un cuerpo negro y la determinación de la temperatura del cuerpo mediante la ley de desplazamiento de Wien, dada por λmáxT = 2, 9 × 10 −3 mK, donde λmáx es la longitud de onda máxima emitida", "nmHours": 0.35294117647058826, "nsExtra": 0, "level": "NM"}], "observations": "Se requiere una explicación elemental de las diferencias físicas entre sólidos, líquidos y gases a partir del modelo molecular. Se requiere la conversión entre las escalas Kelvin y Celsius. El alumnado debe estar familiarizado con los términos fusión, congelación, ebullición, condensación y evaporación. La luminosidad de una estrella puede expresarse en vatios o en función de la luminosidad del Sol, L⊙."}, {"id": "B.2", "title": "Efecto invernadero", "nmHours": 6, "nsExtra": 0, "items": [{"id": "B.2.NM.1", "title": "La conservación de energía", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.2", "title": "La emisividad como el cociente entre la potencia que radia una superficie por unidad de área y la que radia una superficie negra ideal a la misma temperatura, de acuerdo con emisividad = potencia radiada por unidad de área σT 4", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.3", "title": "El albedo como una medida de la energía media reflejada por un sistema macroscópico, de acuerdo con albedo = potencia dispersada total potencia incidente total", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.4", "title": "Que el albedo de la Tierra varía diariamente y depende de las formaciones de nubes y de la latitud", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.5", "title": "La constante solar S", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.6", "title": "Que la potencia radiativa entrante depende de la superficie proyectada de un planeta en la dirección del camino de los rayos, de manera que el valor medio de la intensidad entrante es S4", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.7", "title": "Que el metano CH4, el vapor de agua H2O, el dióxido de carbono CO 2 y el óxido nitroso N 2O son los principales gases de efecto invernadero y que cada uno de ellos tiene un origen tanto natural como creado por la actividad humana", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.8", "title": "La absorción de radiación infrarroja por parte de los principales gases de efecto invernadero en función de los niveles de energía moleculares y la posterior emisión de radiación en todas las direcciones", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.9", "title": "Que el efecto invernadero puede explicarse a partir de un modelo de resonancia y de los niveles de energía moleculares", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "B.2.NM.10", "title": "Que la aumentación del efecto invernadero debida a las actividades humanas se conoce como efecto invernadero de origen antrópico", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}], "observations": "Los problemas incluirán la estimación de la temperatura de equilibrio de un cuerpo a partir del equilibrio energético entre la intensidad de la radiación entrante y la saliente, incluidos el albedo, la emisividad y la constante solar u otras constantes. Los problemas de equilibrio energético incluirán la energía intercambiada entre la superficie y la atmósfera de un cuerpo. La quema de combustibles fósiles es una causa principal del efecto invernadero de origen antrópico."}, {"id": "B.3", "title": "Leyes de los gases", "nmHours": 6, "nsExtra": 0, "items": [{"id": "B.3.NM.1", "title": "La presión, dada por P=FA, donde F es la fuerza ejercida en dirección perpendicular a la superficie", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}, {"id": "B.3.NM.2", "title": "La cantidad de sustancia n, dada por n=NNA, donde N es el número de moléculas y NA es la constante de Avogadro", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}, {"id": "B.3.NM.3", "title": "Que los gases ideales se describen a partir de la teoría cinética y constituyen un sistema modelizado que se emplea para aproximar el comportamiento de los gases reales", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}, {"id": "B.3.NM.4", "title": "Que la ecuación de la ley de los gases ideales puede derivarse de las leyes empíricas de los gases para presión constante, volumen constante y temperatura constante, de acuerdo con PV T = constante", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}, {"id": "B.3.NM.5", "title": "Las ecuaciones que rigen el comportamiento de los gases ideales, dadas por PV = NkBT y PV = nRT", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}, {"id": "B.3.NM.6", "title": "Que el cambio en la cantidad de movimiento de las partículas debido a las colisiones con una determinada superficie da lugar a la presión en los gases y que, a partir de ese análisis, la presión está relacionada con la velocidad media de traslación de las moléculas, de acuerdo con P = 1 3 ρv2", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}, {"id": "B.3.NM.7", "title": "La relación entre la energía interna U de un gas ideal monoatómico y el número de moléculas o la cantidad de sustancia, dada por U = 3 2 NkBT o U = 3 2 nRT", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}, {"id": "B.3.NM.8", "title": "Las condiciones de temperatura, presión y densidad en las que un gas ideal constituye una buena aproximación de un gas real", "nmHours": 0.75, "nsExtra": 0, "level": "NM"}], "observations": "La suposición del modelo cinético es que el gas es ideal. Deben entenderse las diferencias entre un gas ideal y un gas real. Las leyes de gases se limitarán a los casos de volumen constante, temperatura constante y presión constante, y a la ley de los gases ideales. Los cambios de estado de un gas ideal pueden representarse en diagramas de presión-volumen. Se requiere una explicación cualitativa de las propiedades macroscópicas de un gas ideal a partir del comportamiento molecular."}, {"id": "B.4", "title": "Termodinámica", "nmHours": 0, "nsExtra": 8, "items": [{"id": "B.4.NM.1", "title": "Que la primera ley de la termodinámica, dada por Q = ΔU + W, es el resultado de aplicar la conservación de energía a un sistema cerrado y relaciona la energía interna de un sistema con la transferencia de energía en forma de calor y de trabajo", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.2", "title": "Que el trabajo realizado por un sistema cerrado o sobre él, dado por W = PΔ V, cuando cambian los límites del sistema puede describirse en función de la presión y los cambios de volumen de dicho sistema", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.3", "title": "Que el cambio en la energía interna de un sistema, dado por Δ U = 3 2 NkBΔ T = 3 2 nRΔ T, está relacionado con el cambio de su temperatura", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.4", "title": "Que la entropía S es una cantidad termodinámica que está relacionada con el grado de desorden de las partículas de un sistema", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.5", "title": "Que la entropía puede determinarse a partir de cantidades macroscópicas, como la energía térmica y la temperatura, de acuerdo con Δ S = Δ Q T , y también a partir de las propiedades de las partículas individuales del sistema, de acuerdo con S = kB ln Ω , donde kB es la constante de Boltzmann y Ω es el número de posibles microestados del sistema", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.6", "title": "Que la segunda ley de la termodinámica se refiere a la variación de entropía de un sistema aislado e impone restricciones sobre los posibles procesos físicos y sobre la evolución general del sistema", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.7", "title": "Que los procesos en los sistemas aislados reales casi siempre son irreversibles y, en consecuencia, la entropía de un sistema aislado real siempre aumenta", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.8", "title": "Que la entropía de un sistema no aislado puede disminuir localmente, pero ese descenso se ve compensado por un aumento igual o mayor de la entropía del entorno", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.9", "title": "Que los procesos isovolumétricos, isobáricos, isotérmicos y adiabáticos se obtienen al mantener fija una variable", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.10", "title": "Que los procesos adiabáticos en los gases ideales monoatómicos pueden modelizarse mediante la ecuación PV 5 3 = constante", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.11", "title": "Que los procesos cíclicos de los gases sirven para impulsar los motores térmicos", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.12", "title": "Que un motor térmico puede responder a distintos ciclos y está caracterizado por su rendimiento, dado por η = trabajo útil energía de entrada", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NM.13", "title": "Que el ciclo de Carnot impone un límite sobre el rendimiento de un motor térmico a la temperatura de sus fuentes térmicas, dado por ηCarnot = 1– Tf Tc", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "B.4.NS.1", "title": "Que la primera ley de la termodinámica, dada por Q = ΔU + W, es el resultado de aplicar la conservación de energía a un sistema cerrado y relaciona la energía interna de un sistema con la transferencia de energía en forma de calor y de trabajo", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.2", "title": "Que el trabajo realizado por un sistema cerrado o sobre él, dado por W = PΔ V, cuando cambian los límites del sistema puede describirse en función de la presión y los cambios de volumen de dicho sistema", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.3", "title": "Que el cambio en la energía interna de un sistema, dado por Δ U = 3 2 NkBΔ T = 3 2 nRΔ T, está relacionado con el cambio de su temperatura", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.4", "title": "Que la entropía S es una cantidad termodinámica que está relacionada con el grado de desorden de las partículas de un sistema", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.5", "title": "Que la entropía puede determinarse a partir de cantidades macroscópicas, como la energía térmica y la temperatura, de acuerdo con Δ S = Δ Q T , y también a partir de las propiedades de las partículas individuales del sistema, de acuerdo con S = kB ln Ω , donde kB es la constante de Boltzmann y Ω es el número de posibles microestados del sistema", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.6", "title": "Que la segunda ley de la termodinámica se refiere a la variación de entropía de un sistema aislado e impone restricciones sobre los posibles procesos físicos y sobre la evolución general del sistema", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.7", "title": "Que los procesos en los sistemas aislados reales casi siempre son irreversibles y, en consecuencia, la entropía de un sistema aislado real siempre aumenta", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.8", "title": "Que la entropía de un sistema no aislado puede disminuir localmente, pero ese descenso se ve compensado por un aumento igual o mayor de la entropía del entorno", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.9", "title": "Que los procesos isovolumétricos, isobáricos, isotérmicos y adiabáticos se obtienen al mantener fija una variable", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.10", "title": "Que los procesos adiabáticos en los gases ideales monoatómicos pueden modelizarse mediante la ecuación PV 5 3 = constante", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.11", "title": "Que los procesos cíclicos de los gases sirven para impulsar los motores térmicos", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.12", "title": "Que un motor térmico puede responder a distintos ciclos y está caracterizado por su rendimiento, dado por η = trabajo útil energía de entrada", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}, {"id": "B.4.NS.13", "title": "Que el ciclo de Carnot impone un límite sobre el rendimiento de un motor térmico a la temperatura de sus fuentes térmicas, dado por ηCarnot = 1– Tf Tc", "nmHours": 0, "nsExtra": 0.6153846153846154, "level": "NS"}], "observations": "Se entiende que un sistema cerrado es uno donde no se puede transferir masa al sistema o desde él, pero se puede transferir energía en ambos sentidos en forma de calor o de trabajo. Se entiende que un sistema aislado es uno donde no se puede transferir ni masa ni energía al sistema o desde él. Los problemas usarán la convención de signos de Clausius, donde Q es la energía térmica resultante suministrada al sistema y W es el trabajo resultante realizado por el sistema. La segunda ley de la termodinámica debe describirse en la forma de Clausius y la forma de Kelvin, así como en función de la variación de entropía en los procesos reversibles e irreversibles que ocurren en los sistemas aislados. El trabajo realizado sobre un sistema se considera negativo. El trabajo realizado por un sistema se considera positivo. En los problemas cuantitativos, los sistemas se limitarán a gases ideales monoatómicos, incluidas situaciones donde la presión no es constante. Los microestados de un sistema son igualmente probables y pueden describirse mediante un modelo combinatorio simple (por ejemplo, basado en monedas)."}, {"id": "B.5", "title": "Corriente y circuitos", "nmHours": 6, "nsExtra": 0, "items": [{"id": "B.5.NM.1", "title": "Que las celdas proporcionan una fuente de f. e. m.", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.2", "title": "Las celdas químicas y las celdas solares como fuentes de energía de los circuitos", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.3", "title": "Que los diagramas de circuito representan la disposición de los componentes de un circuito", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.4", "title": "La corriente continua (CC) I como un flujo de portadores de carga, de acuerdo con I=ΔqΔt", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.5", "title": "Que la diferencia de potencial eléctrico V es el trabajo por unidad de carga realizado al desplazar una carga positiva entre dos puntos a lo largo del camino de la corriente, de acuerdo con V=Wq", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.6", "title": "Las propiedades de los conductores y aislantes eléctricos en función de la movilidad de los portadores de carga", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.7", "title": "La resistencia eléctrica y su origen", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.8", "title": "La resistencia eléctrica R, dada por R=VI", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.9", "title": "La resistividad, dada por ρ=RAL", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.10", "title": "La ley de Ohm", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.11", "title": "El comportamiento óhmico y no óhmico de los conductores eléctricos, incluido el efecto calórico de los resistores", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.12", "title": "Las combinaciones de resistores en circuitos en serie y paralelos Circuitos en serie Circuitos paralelos I = I1 = I2 = Ω V = V1 + V2 + Ω Rs = R1 + R2 + Ω I = I1 + I2 + Ω V = V1 = V2 = Ω 1 Rp = 1 R1 + 1 R2 + Ω", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.13", "title": "Que las celdas eléctricas están caracterizadas por su f. e. m. ε y su resistencia interna r, de acuerdo con ε = I(R + r)", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "B.5.NM.14", "title": "Que los resistores pueden tener resistencia variable", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}], "observations": "Se deben tratar las ventajas y desventajas de las distintas fuentes de energía eléctrica. En el cuadernillo de datos de Física pueden consultarse los símbolos de un circuito eléctrico que se requieren. No se requieren los circuitos de corriente alterna (CA). Salvo que se indique lo contrario, los amperímetros y voltímetros se considerarán ideales. En los casos donde se utilicen aparatos no ideales, la resistencia será constante. Se considerará que los conductores metálicos a temperatura constante son dispositivos óhmicos. Los resistores variables se limitarán a termistores, resistores dependientes de la luz (LDR) y potenciómetros."}]}, {"id": "C", "title": "Comportamiento de las ondas", "subblocks": [{"id": "C.1", "title": "Movimiento armónico simple", "nmHours": 3, "nsExtra": 4, "items": [{"id": "C.1.NM.1", "title": "Las condiciones que conducen al movimiento armónico simple", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "C.1.NM.2", "title": "La ecuación que define el movimiento armónico simple, dada por a = –ω 2x", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "C.1.NM.3", "title": "Que una partícula que experimenta un movimiento armónico simple puede describirse mediante el período temporal T, la frecuencia ƒ, la frecuencia angular ω, la amplitud, la posición de equilibrio y el desplazamiento", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "C.1.NM.4", "title": "El período temporal en función de la frecuencia de oscilación y la frecuencia angular, de acuerdo con T = 1 ƒ = 2π ω", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "C.1.NM.5", "title": "El período temporal de un sistema masa-resorte, dado por T = 2π m k", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "C.1.NM.6", "title": "El período temporal de un péndulo simple, dado por T = 2π l g", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "C.1.NM.7", "title": "Un enfoque cualitativo de las variaciones de energía que tienen lugar durante un ciclo de una oscilación", "nmHours": 0.42857142857142855, "nsExtra": 0, "level": "NM"}, {"id": "C.1.NS.1", "title": "Que una partícula que experimenta un movimiento armónico simple puede describirse mediante el ángulo de fase", "nmHours": 0, "nsExtra": 2.0, "level": "NS"}, {"id": "C.1.NS.2", "title": "Que los problemas pueden resolverse utilizando las ecuaciones del movimiento armónico simple, dadas por x = x0 sen (ωt + ϕ) v = ωx 0 cos (ωt + ϕ) v = ± ω x0 2–x2 ET = 1 2 mω 2x0 2 Ep = 1 2 mω 2x2", "nmHours": 0, "nsExtra": 2.0, "level": "NS"}], "observations": "Debe comprenderse el significado del signo menos en la ecuación que define el movimiento armónico simple. Deben describirse cualitativamente las variaciones de energía (cinética, potencial y total) que tienen lugar durante el movimiento armónico simple. El enfoque cuantitativo de las variaciones de energía que tienen lugar durante el movimiento armónico simple solo se requiere en el Nivel Superior. En los cálculos del ángulo de fase se utilizan radianes."}, {"id": "C.2", "title": "Modelo ondulatorio", "nmHours": 3, "nsExtra": 0, "items": [{"id": "C.2.NM.1", "title": "Las ondas progresivas transversales y longitudinales", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "C.2.NM.2", "title": "La longitud de onda λ, la frecuencia ƒ, el período temporal T y la velocidad de onda v aplicadas al movimiento ondulatorio, de acuerdo con v = ƒλ = λ T", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "C.2.NM.3", "title": "La naturaleza de las ondas de sonido", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "C.2.NM.4", "title": "La naturaleza de las ondas electromagnéticas", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}, {"id": "C.2.NM.5", "title": "Las diferencias entre las ondas mecánicas y las ondas electromagnéticas", "nmHours": 0.6, "nsExtra": 0, "level": "NM"}], "observations": "Los problemas deberán incluir la descripción del movimiento de las partículas de un medio cuando lo atraviesa una onda tanto transversal como longitudinal. Esta descripción se hará en función del desplazamiento con respecto a la posición a lo largo de la onda y el tiempo. Las ondas progresivas transfieren energía, incluso si no hay un desplazamiento resultante del medio. Consulte el cuadernillo de datos de Física para ver el orden de magnitud aproximado de las longitudes de onda de los espectros de radio, microondas, infrarrojo, visible, ultravioleta, rayos X y rayos gamma. Se debe aplicar el modelo ondulatorio tanto a las ondas mecánicas como a las ondas electromagnéticas."}, {"id": "C.3", "title": "Fenómenos ondulatorios", "nmHours": 5, "nsExtra": 6, "items": [{"id": "C.3.NM.1", "title": "Que las ondas que viajan en dos y tres dimensiones pueden describirse mediante los conceptos de frentes de onda y rayos", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.2", "title": "El comportamiento ondulatorio en los límites entre medios a partir de la reflexión, refracción y transmisión", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.3", "title": "La difracción de las ondas alrededor de un cuerpo y a través de una apertura", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.4", "title": "Los diagramas de frente de onda que muestran refracción y difracción", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.5", "title": "La ley de Snell, el ángulo crítico y la reflexión total interna", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.6", "title": "La ley de Snell, dada por n1 n2 = sen θ2 sen θ1 = v2 v1 , donde n es el índice de refracción y θ es el ángulo que forman la normal y el rayo", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.7", "title": "La superposición de ondas y los pulsos ondulatorios", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.8", "title": "Que la interferencia de dos fuentes requiere fuentes coherentes", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.9", "title": "La condición para que se produzca interferencia constructiva, dada por diferencia de caminos = nλ", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.10", "title": "La condición para que se produzca interferencia destructiva, dada por diferencia de caminos = ( n + 1 2 )λ", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NM.11", "title": "La doble rendija de Young, de acuerdo con s=λDd, donde s es la separación entre las franjas, d es la separación entre las rendijas y D es la distancia entre las rendijas y la pantalla", "nmHours": 0.45454545454545453, "nsExtra": 0, "level": "NM"}, {"id": "C.3.NS.1", "title": "La difracción de rendija única, incluidos los patrones de intensidad dados por θ=λb, donde b es la anchura de la rendija", "nmHours": 0, "nsExtra": 2.0, "level": "NS"}, {"id": "C.3.NS.2", "title": "Que el patrón de rendija única modula el patrón de interferencia de doble rendija", "nmHours": 0, "nsExtra": 2.0, "level": "NS"}, {"id": "C.3.NS.3", "title": "Los patrones de interferencia producidos por rendijas múltiples y redes de difracción, dados por nλ = d sen θ", "nmHours": 0, "nsExtra": 2.0, "level": "NS"}], "observations": "Los problemas pueden incluir dibujar aproximadamente e interpretar frentes de onda y rayos. Esto se limitará a las ondas incidente, reflejada y transmitida. Los patrones de interferencia y difracción se limitarán a los que se producen cuando la incidencia es perpendicular. El efecto de la anchura de la rendija sobre la intensidad del patrón de difracción de rendija única debe considerarse cualitativamente. La discusión de la difracción de rendija única se limitará a luz monocromática y rendijas rectangulares. Deben discutirse los patrones de rendijas múltiples y redes de difracción producidos a partir de luz blanca y de una serie de longitudes de onda de luz monocromática."}, {"id": "C.4", "title": "Ondas estacionarias y resonancia", "nmHours": 4, "nsExtra": 0, "items": [{"id": "C.4.NM.1", "title": "La naturaleza y la formación de las ondas estacionarias en función de la superposición de dos ondas idénticas que viajan en sentidos opuestos", "nmHours": 0.6666666666666666, "nsExtra": 0, "level": "NM"}, {"id": "C.4.NM.2", "title": "Los nodos y antinodos, la amplitud relativa y la diferencia de fase de los puntos de una onda estacionaria", "nmHours": 0.6666666666666666, "nsExtra": 0, "level": "NM"}, {"id": "C.4.NM.3", "title": "Los patrones de las ondas estacionarias en cuerdas y tuberías", "nmHours": 0.6666666666666666, "nsExtra": 0, "level": "NM"}, {"id": "C.4.NM.4", "title": "La naturaleza de la resonancia, incluidas la frecuencia natural y la amplitud de oscilación, en función de la frecuencia impulsora", "nmHours": 0.6666666666666666, "nsExtra": 0, "level": "NM"}, {"id": "C.4.NM.5", "title": "El efecto de la amortiguación sobre la amplitud máxima y la frecuencia resonante de oscilación", "nmHours": 0.6666666666666666, "nsExtra": 0, "level": "NM"}, {"id": "C.4.NM.6", "title": "Los efectos de la subamortiguación, la amortiguación crítica y la sobreamortiguación en el sistema", "nmHours": 0.6666666666666666, "nsExtra": 0, "level": "NM"}], "observations": "No se debe considerar la formación de ondas estacionarias a partir de la superposición de más de dos ondas. Las tuberías se clasificarán en abiertas o cerradas. No se requieren correcciones de extremos en las tuberías abiertas. Las posibles condiciones de contorno para las cuerdas son: los dos extremos fijos, un extremo fijo y el otro libre, y los dos extremos libres. Las condiciones de contorno para el aire en las tuberías son los dos extremos cerrados, un extremo cerrado y el otro abierto, y los dos extremos abiertos. Se discutirán los modos de vibración del aire en las tuberías en función de los nodos y antinodos de desplazamiento. Para las ondas estacionarias en el aire, no se requieren los nodos y antinodos de presión. El modo de menor frecuencia de una onda estacionaria se denominará primer armónico. Los términos fundamental y sobretono no se emplearán en este curso. Se requiere la determinación de la longitud de onda y la frecuencia del n-ésimo armónico dada la longitud de la cuerda o tubería y la velocidad de la onda. Solo se requiere un análisis cualitativo del efecto de la amortiguación sobre la respuesta en frecuencia de un oscilador forzado. Se requiere el conocimiento de los efectos tanto útiles como destructivos de la resonancia."}, {"id": "C.5", "title": "Efecto Doppler", "nmHours": 2, "nsExtra": 2, "items": [{"id": "C.5.NM.1", "title": "La naturaleza del efecto Doppler para las ondas de sonido y las ondas electromagnéticas", "nmHours": 0.5, "nsExtra": 0, "level": "NM"}, {"id": "C.5.NM.2", "title": "La representación del efecto Doppler mediante diagramas de frente de onda cuando se está moviendo la fuente o el observador", "nmHours": 0.5, "nsExtra": 0, "level": "NM"}, {"id": "C.5.NM.3", "title": "La variación relativa observada en la frecuencia o la longitud de onda de una onda lumínica como consecuencia del efecto Doppler cuando la velocidad de la luz es mucho mayor que la velocidad relativa entre la fuente y el observador, de acuerdo con Δ ƒ ƒ = Δ λ λ ≈ vc", "nmHours": 0.5, "nsExtra": 0, "level": "NM"}, {"id": "C.5.NM.4", "title": "Que los desplazamientos de las líneas espectrales proporcionan información sobre el movimiento de cuerpos como las estrellas y las galaxias en el espacio", "nmHours": 0.5, "nsExtra": 0, "level": "NM"}, {"id": "C.5.NS.1", "title": "La frecuencia observada para las ondas de sonido y las ondas mecánicas como consecuencia del efecto Doppler, dada por: Fuente en movimiento: ƒ′ = ƒ v v ± us , donde us es la velocidad de la fuente Observador en movimiento: ƒ′ = ƒ v ± uo v , donde uo es la velocidad del observador", "nmHours": 0, "nsExtra": 2.0, "level": "NS"}], "observations": "Los problemas no incluirán situaciones donde se muevan tanto la fuente como el observador. Los problemas pueden incluir la determinación de la velocidad de la fuente o del observador. Se debe considerar a modo de ejemplo el uso del efecto Doppler en física médica y en los radares."}]}, {"id": "D", "title": "Campos", "subblocks": [{"id": "D.1", "title": "El campo gravitatorio", "nmHours": 5, "nsExtra": 7, "items": [{"id": "D.1.NM.1", "title": "Las tres leyes del movimiento orbital de Kepler", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.1.NM.2", "title": "La ley de la gravitación de Newton, dada por F = G m1m2 r2 , para cuerpos tratados como masas puntuales", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.1.NM.3", "title": "Las condiciones en las que los cuerpos extendidos pueden tratarse como masas puntuales", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.1.NM.4", "title": "Que la intensidad del campo gravitatorio g en un punto es la fuerza por unidad de masa que actúa sobre una pequeña masa puntual situada en dicho punto, de acuerdo con g = F m = G M r2", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.1.NM.5", "title": "Las líneas de campo gravitatorio", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.1.NS.1", "title": "Que la energía potencial gravitatoria Ep de un sistema es el trabajo realizado para formar el sistema partiendo de una separación infinita de sus componentes", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.2", "title": "La energía potencial gravitatoria de un sistema de dos cuerpos, dada por Ep = –G m1m2 r , donde r es la separación entre los centros de masa de los dos cuerpos", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.3", "title": "Que el potencial gravitatorio Vg en un punto es el trabajo por unidad de masa realizado al traer una masa desde el infinito hasta ese punto, de acuerdo con Vg = –G M r", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.4", "title": "La intensidad del campo gravitatorio g como el gradiente de potencial gravitatorio, de acuerdo con g = – Δ Vg Δ r", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.5", "title": "El trabajo realizado al mover una masa m en un campo gravitatorio, dado por W = mΔ Vg", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.6", "title": "Las superficies equipotenciales para el campo gravitatorio", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.7", "title": "La relación entre las superficies equipotenciales y las líneas de campo gravitatorio", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.8", "title": "La velocidad de escape vesc en cualquier punto de un campo gravitatorio, dada por vesc = 2GM r", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.9", "title": "La velocidad orbital vorbital de un cuerpo que orbita alrededor de una gran masa, dada por vorbital = GM r", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}, {"id": "D.1.NS.10", "title": "El efecto cualitativo de una pequeña fuerza de resistencia viscosa debido a la atmósfera sobre la altura y la velocidad de un cuerpo en órbita", "nmHours": 0, "nsExtra": 0.7, "level": "NS"}], "observations": "En los cálculos que impliquen movimiento orbital, se supondrá que las órbitas son circulares. La ley de la gravitación de Newton debe extenderse a las masas esféricas de densidad uniforme, bajo el supuesto de que su masa está concentrada en su centro. La determinación de la intensidad resultante del campo gravitatorio se limitará a puntos a lo largo de la recta que une dos cuerpos. Se requiere dibujar aproximadamente e interpretar líneas de campo gravitatorio. El potencial gravitatorio se define como cero en el infinito. Algunos problemas pueden incluir la determinación de: • La velocidad necesaria para mantener la órbita • Las variaciones de energía cuando un satélite cambia de órbita • La energía de un satélite que entra en órbita alrededor de un planeta que no rota, partiendo del reposo desde su superficie • Las condiciones energéticas para que un satélite en órbita escape de la influencia gravitatoria de un planeta Los campos gravitatorios incluirán los campos radiales alrededor de masas puntuales o esféricas y el campo (que se asume) uniforme cercano a la superficie de planetas o cuerpos celestes masivos. El movimiento orbital de un satélite alrededor de un planeta se limita a órbitas circulares. Se requiere la capacidad de mapear los campos utilizando el potencial."}, {"id": "D.2", "title": "Campos eléctricos y magnéticos", "nmHours": 8, "nsExtra": 6, "items": [{"id": "D.2.NM.1", "title": "El sentido de las fuerzas entre los dos tipos de cargas eléctricas", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.2", "title": "La ley de Coulomb, dada por F = k q1q2 r2 , para cuerpos cargados tratados como cargas puntuales, donde k = 1 4πε0", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.3", "title": "La conservación de la carga eléctrica", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.4", "title": "El experimento de Millikan como prueba de la cuantización de la carga eléctrica", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.5", "title": "Que la carga eléctrica puede transferirse entre cuerpos mediante la fricción, la inducción electrostática, y por contacto, incluida la función de la toma de tierra", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.6", "title": "La intensidad del campo eléctrico, dada por E=Fq", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.7", "title": "Las líneas de campo eléctrico", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.8", "title": "La relación entre la densidad de líneas de campo y la intensidad del campo", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.9", "title": "La intensidad del campo eléctrico uniforme entre dos placas paralelas, dada por E=Vd", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NM.10", "title": "Las líneas de campo magnético", "nmHours": 0.8, "nsExtra": 0, "level": "NM"}, {"id": "D.2.NS.1", "title": "La energía potencial eléctrica Ep en función del trabajo realizado para formar el sistema partiendo de una separación infinita", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}, {"id": "D.2.NS.2", "title": "La energía potencial eléctrica para un sistema de dos cuerpos cargados, dada por Ep = k q1q2 r", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}, {"id": "D.2.NS.3", "title": "Que el potencial eléctrico es una cantidad escalar definida como cero en el infinito", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}, {"id": "D.2.NS.4", "title": "Que el potencial eléctrico Ve en un punto es el trabajo por unidad de carga realizado para traer una carga de prueba desde el infinito hasta ese punto, de acuerdo con Ve = kQ r", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}, {"id": "D.2.NS.5", "title": "La intensidad del campo eléctrico E como el gradiente de potencial eléctrico, de acuerdo con E = – Δ Ve Δ r", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}, {"id": "D.2.NS.6", "title": "El trabajo realizado al mover una carga q en un campo eléctrico, dado por W = qΔ Ve", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}, {"id": "D.2.NS.7", "title": "Las superficies equipotenciales para el campo eléctrico", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}, {"id": "D.2.NS.8", "title": "La relación entre las superficies equipotenciales y las líneas de campo eléctrico", "nmHours": 0, "nsExtra": 0.75, "level": "NS"}], "observations": "Entre los campos eléctricos se incluirán: • El campo radial alrededor de una única carga puntual • El campo dentro y fuera de un único cuerpo conductor esférico • El campo entre dos cargas puntuales • Dos placas paralelas con carga opuesta, incluidos los efectos de borde Se requiere dibujar aproximadamente e interpretar líneas de campo eléctrico. Los patrones del campo magnético se limitarán a un imán de barra, un cable recto que transporta corriente, una bobina circular que transporta corriente y un solenoide de núcleo de aire. Se requiere dibujar aproximadamente e interpretar líneas de campo magnético. Se requiere determinar la dirección del campo magnético a partir del sentido de la corriente en un cable recto que transporta corriente. El trabajo realizado en los campos eléctricos puede expresarse tanto en julios como en electronvoltios. Se requiere un rango de valores de la permitividad para la ley de Coulomb. El potencial eléctrico se define como cero en el infinito. No se realiza ningún trabajo al mover cargas o masas sobre una superficie equipotencial. Se deben reconocer las superficies equipotenciales: • Para una carga puntual • Para un conjunto de hasta cuatro cargas puntuales • Dentro y fuera de una esfera conductora maciza cargada • Dentro y fuera de una esfera conductora hueca cargada • Entre dos placas paralelas con carga opuesta"}, {"id": "D.3", "title": "Movimiento en campos electromagnéticos", "nmHours": 6, "nsExtra": 0, "items": [{"id": "D.3.NM.1", "title": "El movimiento de una partícula cargada en un campo eléctrico uniforme", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.3.NM.2", "title": "El movimiento de una partícula cargada en un campo magnético uniforme", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.3.NM.3", "title": "El movimiento de una partícula cargada en campos eléctricos y magnéticos uniformes perpendiculares entre sí", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.3.NM.4", "title": "La magnitud y dirección de la fuerza sobre una carga que se desplaza en un campo magnético, de acuerdo con F = qvB sen θ", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.3.NM.5", "title": "La magnitud y dirección de la fuerza sobre un conductor que transporta corriente en un campo magnético, de acuerdo con F = BΙL sen θ", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "D.3.NM.6", "title": "La fuerza por unidad de longitud entre cables paralelos, dada por F L = μ0 I1I2 2πr , donde r es la separación entre los dos cables", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}], "observations": "La energía cinética de una partícula cargada en un campo magnético permanece constante. Se requiere determinar la relación carga-masa de una partícula cargada mediante la investigación de su trayectoria en un campo magnético uniforme. Se requiere determinar la dirección del campo magnético a partir del sentido de la corriente en un cable recto que transporta corriente. Para cables paralelos que transportan corriente, la fuerza es atractiva cuando la corriente circula en el mismo sentido en ambos."}, {"id": "D.4", "title": "Inducción", "nmHours": 0, "nsExtra": 6, "items": [{"id": "D.4.NM.1", "title": "El flujo magnético Φ, dado por Φ = BA cos θ", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "D.4.NM.2", "title": "Que un flujo magnético variable en el tiempo induce una f. e. m. ε dada por la ley de inducción de Faraday, ε = − N Δ Φ Δ t", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "D.4.NM.3", "title": "Que un campo magnético uniforme induce una f. e. m. en un conductor recto que se desplaza perpendicular a él, dada por ε=BvL", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "D.4.NM.4", "title": "Que la dirección de la f. e. m. inducida está determinada por la ley de Lenz y es una consecuencia de la conservación de energía", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "D.4.NM.5", "title": "Que un campo magnético uniforme induce una f. e. m. variable sinusoidal en una bobina que rota en su interior", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "D.4.NM.6", "title": "El efecto de cambiar la frecuencia de rotación sobre la f. e. m. inducida", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "D.4.NS.1", "title": "El flujo magnético Φ, dado por Φ = BA cos θ", "nmHours": 0, "nsExtra": 1.0, "level": "NS"}, {"id": "D.4.NS.2", "title": "Que un flujo magnético variable en el tiempo induce una f. e. m. ε dada por la ley de inducción de Faraday, ε = − N Δ Φ Δ t", "nmHours": 0, "nsExtra": 1.0, "level": "NS"}, {"id": "D.4.NS.3", "title": "Que un campo magnético uniforme induce una f. e. m. en un conductor recto que se desplaza perpendicular a él, dada por ε=BvL", "nmHours": 0, "nsExtra": 1.0, "level": "NS"}, {"id": "D.4.NS.4", "title": "Que la dirección de la f. e. m. inducida está determinada por la ley de Lenz y es una consecuencia de la conservación de energía", "nmHours": 0, "nsExtra": 1.0, "level": "NS"}, {"id": "D.4.NS.5", "title": "Que un campo magnético uniforme induce una f. e. m. variable sinusoidal en una bobina que rota en su interior", "nmHours": 0, "nsExtra": 1.0, "level": "NS"}, {"id": "D.4.NS.6", "title": "El efecto de cambiar la frecuencia de rotación sobre la f. e. m. inducida", "nmHours": 0, "nsExtra": 1.0, "level": "NS"}], "observations": "Entre los ejemplos de producción de una f. e. m. inducida debe haber: • Campos magnéticos variables en el tiempo • Bobinas que rotan en un campo magnético uniforme • El movimiento relativo entre un conductor y un campo magnético (por ejemplo, un imán que oscila en un resorte por encima de una bobina conductora, o una bobina que entra o sale de la región donde existe un campo magnético) El tratamiento cuantitativo de la f. e. m. se limitará a conductores rectos que se desplazan en ángulos rectos con respecto a los campos magnéticos y a bobinas rectangulares que entran y salen de campos o que rotan dentro del campo. Solo se requiere un tratamiento cualitativo de la autoinducción. No se requiere una discusión de la inductancia y los circuitos RL (resistencia-inductancia)."}]}, {"id": "E", "title": "Física nuclear y cuántica", "subblocks": [{"id": "E.1", "title": "Estructura del átomo", "nmHours": 6, "nsExtra": 3, "items": [{"id": "E.1.NM.1", "title": "El experimento de Rutherford-Geiger-Marsden y el descubrimiento del núcleo", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "E.1.NM.2", "title": "La notación nuclear XZA, donde A es el número de nucleones, Z es el número de protones y X es el símbolo químico", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "E.1.NM.3", "title": "Que los espectros de emisión y absorción proporcionan pruebas de la naturaleza discreta de los niveles de energía atómicos", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "E.1.NM.4", "title": "Que durante las transiciones atómicas se emiten y absorben fotones", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "E.1.NM.5", "title": "Que la frecuencia del fotón liberado durante una transición atómica depende de la diferencia entre los niveles de energía, de acuerdo con E=hƒ", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "E.1.NM.6", "title": "Que los espectros de emisión y absorción proporcionan información sobre la composición química", "nmHours": 1.0, "nsExtra": 0, "level": "NM"}, {"id": "E.1.NS.1", "title": "La relación entre el radio de un núcleo y su número de nucleones, dada por R = R0A 1 3, y las repercusiones para las densidades nucleares", "nmHours": 0, "nsExtra": 0.6, "level": "NS"}, {"id": "E.1.NS.2", "title": "Las desviaciones de la dispersión de Rutherford a altas energías", "nmHours": 0, "nsExtra": 0.6, "level": "NS"}, {"id": "E.1.NS.3", "title": "La distancia de la aproximación más cercana en experimentos de dispersión frontal", "nmHours": 0, "nsExtra": 0.6, "level": "NS"}, {"id": "E.1.NS.4", "title": "Los niveles energéticos discretos en el modelo de Bohr para el hidrógeno, dados por E = − 13, 6 n2 eV", "nmHours": 0, "nsExtra": 0.6, "level": "NS"}, {"id": "E.1.NS.5", "title": "Que la existencia de energía y órbitas cuantizadas se debe a la cuantización del momento angular en el modelo de Bohr para el hidrógeno, de acuerdo con mvr = nh 2π", "nmHours": 0, "nsExtra": 0.6, "level": "NS"}], "observations": "No es necesario memorizar los símbolos químicos. En el Nivel Medio solo se requiere un enfoque cualitativo del experimento de Rutherford-Geiger-Marsden. Se pueden usar las sencillas consideraciones de Rutherford sobre la conservación de energía para determinar la distancia de la aproximación más cercana. En los experimentos de dispersión, los valores de la energía serán lo bastante bajos como para considerar únicamente la partícula que repele la fuerza eléctrica."}, {"id": "E.2", "title": "Física cuántica", "nmHours": 0, "nsExtra": 8, "items": [{"id": "E.2.NM.1", "title": "El efecto fotoeléctrico como prueba de la naturaleza corpuscular de la luz", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.2", "title": "Que se requieren fotones de una determinada frecuencia, conocida como umbral de frecuencia, para liberar fotoelectrones del metal", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.3", "title": "La explicación de Einstein a partir de la función de trabajo y la energía cinética máxima de los fotoelectrones, dada por Emáx = hƒ–Φ, donde Φ es la función de trabajo del metal", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.4", "title": "La difracción de partículas como prueba de la naturaleza ondulatoria de la materia", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.5", "title": "Que la materia exhibe la dualidad onda-partícula", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.6", "title": "La longitud de onda de De Broglie para las partículas, dada por λ=hp", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.7", "title": "La dispersión de Compton de la luz por los electrones como prueba adicional de la naturaleza corpuscular de la luz", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.8", "title": "Que la longitud de onda de los fotones aumenta al ser dispersados por los electrones", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NM.9", "title": "El cambio en la longitud de onda del fotón tras ser dispersado por un electrón, dado por λf–λi = Δ λ = h mec (1–cos θ)", "nmHours": 0.0, "nsExtra": 0, "level": "NM"}, {"id": "E.2.NS.1",
