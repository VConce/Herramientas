    function quickAddArrow() {
      ensureYear(state.currentYear);
      const start = selectedDate || `${getYearStart(state.currentYear)}-09-01`;
      const end = addDays(start, 2);
      const text = prompt("Texto de la flecha", "Nuevo tema");
      if (text === null) return;
      state.arrows[state.currentYear].push({ id: `a-${Date.now()}-${Math.random().toString(16).slice(2)}`, start, end, text: text.trim() || "Nuevo tema", color: $("arrowColor")?.value || "#00b050" });
      markDirty();
      render();
    }

    function startArrowDrag(event, id, mode) {
      if (event.button !== undefined && event.button !== 0) return;
      if (event.detail && event.detail > 1) return;
      if (event.target.closest?.('.topic-label')?.isContentEditable) return;
      event.preventDefault();
      event.stopPropagation();
      const arrow = (state.arrows[state.currentYear] || []).find(a => a.id === id);
      if (!arrow) return;
      const snap = snapPointerToDate(event.clientX, event.clientY);
      activeArrowDrag = {
        id,
        mode,
        duration: diffDays(arrow.start, arrow.end),
        grabOffset: snap ? diffDays(arrow.start, snap.date) : 0
      };
      event.currentTarget.closest(".topic-arrow")?.classList.add("dragging");
      event.currentTarget.setPointerCapture?.(event.pointerId);
    }

    function beginArrowTextEdit(label) {
      activeArrowDrag = null;
      label.contentEditable = "true";
      label.focus();
      selectElementText(label);
    }

    function selectElementText(element) {
      const range = document.createRange();
      range.selectNodeContents(element);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function updateArrowDrag(event) {
      if (!activeArrowDrag) return;
      const arrow = (state.arrows[state.currentYear] || []).find(a => a.id === activeArrowDrag.id);
      const snap = snapPointerToDate(event.clientX, event.clientY);
      if (!arrow || !snap) return;
      const pointerDate = snap.date;
      if (activeArrowDrag.mode === "move") {
        const start = addDays(pointerDate, -activeArrowDrag.grabOffset);
        arrow.start = start;
        arrow.end = addDays(start, activeArrowDrag.duration);
        arrow.lane = snap.lane;
      } else if (activeArrowDrag.mode === "start") {
        if (pointerDate <= arrow.end) arrow.start = pointerDate;
        arrow.lane = snap.lane;
      } else if (activeArrowDrag.mode === "end") {
        if (pointerDate >= arrow.start) arrow.end = pointerDate;
        arrow.lane = snap.lane;
      }
      render();
    }

    function finishArrowDrag() {
      if (!activeArrowDrag) return;
      activeArrowDrag = null;
      markDirty();
    }

    function columnOffsetFromPointer(row, clientX) {
      const columns = [...row.querySelectorAll('.arrow-lane[data-lane="1"]')]
        .sort((a, b) => Number(a.style.gridColumn) - Number(b.style.gridColumn));
      if (columns.length < 7) {
        const rect = row.getBoundingClientRect();
        return Math.floor((clientX - rect.left) / (rect.width / 7));
      }
      const first = columns[0].getBoundingClientRect();
      const last = columns[columns.length - 1].getBoundingClientRect();
      if (clientX < first.left) return Math.floor((clientX - first.left) / Math.max(1, first.width));
      for (let i = 0; i < columns.length; i++) {
        const rect = columns[i].getBoundingClientRect();
        if (clientX < rect.right) return i;
      }
      return columns.length + Math.floor((clientX - last.right) / Math.max(1, last.width));
    }

    function snapPointerToDate(clientX, clientY) {
      const row = nearestArrowWeek(clientX, clientY);
      if (!row) return null;
      const rect = row.getBoundingClientRect();
      const offset = columnOffsetFromPointer(row, clientX);
      const clampedOffset = Math.max(-14, Math.min(35, offset));
      const lanes = [...row.querySelectorAll(".arrow-lane")];
      const visibleLaneCount = Math.max(1, Number(row.dataset.laneCount || 1));
      const maxSnapLane = activeArrowDrag ? Math.min(3, visibleLaneCount + 1) : visibleLaneCount;
      const targetColumn = Math.max(1, Math.min(7, offset + 1));
      const sameColumnLanes = lanes.filter(lane => Number(lane.dataset.lane || 1) <= maxSnapLane && Number(lane.style.gridColumn) === targetColumn);
      const laneCandidates = sameColumnLanes.length ? sameColumnLanes : lanes.filter(lane => Number(lane.dataset.lane || 1) <= maxSnapLane);
      const nearestLane = laneCandidates
        .map((laneEl, index) => {
          const laneRect = laneEl.getBoundingClientRect();
          const center = laneRect.top + laneRect.height / 2;
          const lane = Number(laneEl.dataset.lane || index + 1);
          return { lane, distance: Math.abs(clientY - center) };
        })
        .sort((a, b) => a.distance - b.distance)[0];
      let lane = nearestLane ? nearestLane.lane : 1;
      if (activeArrowDrag) {
        const firstLane = row.querySelector(".arrow-lane");
        const arrowBandTop = firstLane ? firstLane.getBoundingClientRect().top : rect.bottom - 24;
        const laneHeight = firstLane ? Math.max(8, firstLane.getBoundingClientRect().height) : 24;
        const projectedLane = Math.floor((clientY - arrowBandTop) / laneHeight) + 1;
        lane = Math.max(1, Math.min(maxSnapLane, Math.max(lane, projectedLane)));
      }
      return { date: addDays(row.dataset.weekStart, clampedOffset), lane };
    }

    function nearestArrowWeek(clientX, clientY) {
      const rows = [...document.querySelectorAll(".week-row")];
      if (!rows.length) return null;
      const direct = document.elementFromPoint(Math.max(0, Math.min(window.innerWidth - 1, clientX)), Math.max(0, Math.min(window.innerHeight - 1, clientY)))?.closest?.(".week-row");
      if (direct) return direct;
      return rows
        .map(row => {
          const rect = row.getBoundingClientRect();
          const distance = clientY < rect.top ? rect.top - clientY : clientY > rect.bottom ? clientY - rect.bottom : 0;
          return { row, distance };
        })
        .sort((a, b) => a.distance - b.distance)[0].row;
    }

    function adjustArrow(id, edge, delta) {
      const arrow = (state.arrows[state.currentYear] || []).find(a => a.id === id);
      if (!arrow) return;
      if (edge === "start") {
        const next = addDays(arrow.start, delta);
        if (next <= arrow.end) arrow.start = next;
      } else {
        const next = addDays(arrow.end, delta);
        if (next >= arrow.start) arrow.end = next;
      }
      markDirty();
      render();
    }

    function addDays(dateIso, amount) {
      const d = parseIso(dateIso);
      d.setDate(d.getDate() + amount);
      return iso(d);
    }

    function diffDays(startIso, endIso) {
      return Math.round((parseIso(endIso) - parseIso(startIso)) / 86400000);
    }

    function isClassDay(date) {
      if (state.holidays[state.currentYear]?.[iso(date)]) return false;
      return state.classDays[mondayIndex(date)];
    }

    function isArrowVisibleCourseDate(date) {
      const key = iso(date);
      const entry = state.entries[state.currentYear]?.[key] || {};
      if (mondayIndex(date) >= 5) return false;
      if (!state.classDays[mondayIndex(date)]) return false;
      if (state.holidays[state.currentYear]?.[key]) return false;
      if (entry.color === "holiday") return false;
      return true;
    }

    function isArrowVisibleInMonth(date, month) {
      return date.getMonth() === month && isArrowVisibleCourseDate(date);
    }

    function visibleArrowSegmentsForWeek(arrow, week, month) {
      const segments = [];
      let current = null;
      week.forEach((date, index) => {
        const key = iso(date);
        const visible = key >= arrow.start && key <= arrow.end && isArrowVisibleInMonth(date, month);
        if (visible && !current) current = { startIndex: index, endIndex: index, startDate: key, endDate: key };
        else if (visible) {
          current.endIndex = index;
          current.endDate = key;
        } else if (current) {
          segments.push(current);
          current = null;
        }
      });
      if (current) segments.push(current);
      return segments;
    }

    function hasVisibleArrowDateBefore(arrow, dateIso) {
      for (let key = arrow.start; key < dateIso; key = addDays(key, 1)) {
        if (isArrowVisibleCourseDate(parseIso(key))) return true;
      }
      return false;
    }

    function hasVisibleArrowDateAfter(arrow, dateIso) {
      for (let key = addDays(dateIso, 1); key <= arrow.end; key = addDays(key, 1)) {
        if (isArrowVisibleCourseDate(parseIso(key))) return true;
      }
      return false;
    }

    function getEntry(key) {
      ensureYear(state.currentYear);
      if (!state.entries[state.currentYear][key]) state.entries[state.currentYear][key] = {};
      return state.entries[state.currentYear][key];
    }

    function setDayColor(key, color) {
      const rec = getEntry(key);
      if (color === "blank") delete rec.color;
      else rec.color = color;
      markDirty();
      render();
    }

    function updateSelectionUi() {
      document.body.classList.toggle("selection-mode", selectionMode);
      $("selectModeBtn")?.classList.toggle("active", selectionMode);
      if ($("selectionCount")) {
        const count = selectedDays.size;
        $("selectionCount").textContent = `${count} ${count === 1 ? "día" : "días"}`;
      }
      if ($("deleteSelectedBtn")) $("deleteSelectedBtn").disabled = selectedDays.size === 0;
      if ($("clearSelectionBtn")) $("clearSelectionBtn").disabled = selectedDays.size === 0;
    }

    function setSelectionMode(enabled) {
      selectionMode = enabled;
      if (!selectionMode) {
        selectedDays.clear();
        lastSelectionDate = null;
      }
      updateSelectionUi();
      render();
    }

    function toggleDaySelection(key, useRange = false) {
      ensureYear(state.currentYear);
      if (useRange && lastSelectionDate) {
        const slots = academicSlots();
        const a = slots.indexOf(lastSelectionDate);
        const b = slots.indexOf(key);
        if (a !== -1 && b !== -1) {
          const [start, end] = a < b ? [a, b] : [b, a];
          for (const day of slots.slice(start, end + 1)) selectedDays.add(day);
        } else {
          selectedDays.add(key);
        }
      } else if (selectedDays.has(key)) {
        selectedDays.delete(key);
      } else {
        selectedDays.add(key);
      }
      lastSelectionDate = key;
      updateSelectionUi();
      render();
    }

    function clearSelection() {
      selectedDays.clear();
      lastSelectionDate = null;
      updateSelectionUi();
      render();
    }

    function deleteSelectedDays() {
      ensureYear(state.currentYear);
      const count = selectedDays.size;
      if (!count) return;
      if (!confirm(`Borrar el contenido editable de ${count} ${count === 1 ? "día seleccionado" : "días seleccionados"}?`)) return;
      const entries = state.entries[state.currentYear];
      selectedDays.forEach(key => {
        if (!entries[key]) return;
        const fixed = entries[key].fixed;
        if (fixed) entries[key] = { fixed: true };
        else delete entries[key];
      });
      selectedDays.clear();
      lastSelectionDate = null;
      markDirty();
      updateSelectionUi();
      render();
    }

    function moveDayEntry(sourceKey, targetKey) {
      ensureYear(state.currentYear);
      if (!sourceKey || !targetKey || sourceKey === targetKey) return;
      const entries = state.entries[state.currentYear];
      const source = cloneEntry(entries[sourceKey]) || {};
      entries[targetKey] = source;
      delete entries[sourceKey];
      selectedDays.delete(sourceKey);
      selectedDays.delete(targetKey);
      lastSelectionDate = null;
      markDirty();
      updateSelectionUi();
      render();
      updateStatus(`Dia movido de ${sourceKey} a ${targetKey}.`);
    }

    function openArrowMenu(id, x, y) {
      const arrow = (state.arrows[state.currentYear] || []).find(item => item.id === id);
      if (!arrow) return;
      closeDayMenu();
      const menu = $("arrowMenu");
      menu.innerHTML = `
        <label class="inline-label">Cambiar color <input data-arrow-color type="color" value="${escapeHtml(arrow.color || "#00b050")}"></label>
        <div class="color-presets" data-arrow-color-presets></div>
        <div class="sep"></div>
        <button data-arrow-action="delete">Eliminar flecha</button>`;
      const colorInput = menu.querySelector("[data-arrow-color]");
      const presetBox = menu.querySelector("[data-arrow-color-presets]");
      const applyArrowColor = (color) => {
        if (!/^#[0-9a-fA-F]{6}$/.test(color)) return;
        arrow.color = color;
        colorInput.value = color;
        syncArrowColorPresetState(presetBox, color);
        markDirty();
        render();
      };
      colorInput.addEventListener("input", (event) => applyArrowColor(event.target.value));
      renderColorPresets(presetBox, arrow.color || "#00b050", applyArrowColor);
      menu.querySelector('[data-arrow-action="delete"]').addEventListener("click", () => {
        deleteArrow(id);
        closeArrowMenu();
      });
      menu.classList.add("open");
      const rect = menu.getBoundingClientRect();
      menu.style.left = `${Math.min(x, window.innerWidth - rect.width - 8)}px`;
      menu.style.top = `${Math.min(y, window.innerHeight - rect.height - 8)}px`;
    }

    function deleteArrow(id) {
      ensureYear(state.currentYear);
      state.arrows[state.currentYear] = (state.arrows[state.currentYear] || []).filter(arrow => arrow.id !== id);
      markDirty();
      render();
      updateStatus("Flecha eliminada.");
    }

    function closeArrowMenu() {
      $("arrowMenu").classList.remove("open");
    }

    function openDayMenu(key, x, y) {
      closeArrowMenu();
      const rec = state.entries[state.currentYear][key] || {};
      const menu = $("dayMenu");
      menu.innerHTML = `
        <button data-menu-color="blank"><span class="dot blank"></span> Normal</button>
        <button data-menu-color="exercise"><span class="dot exercise"></span> Ejercicios</button>
        <button data-menu-color="exam"><span class="dot exam"></span> Examen</button>
        <button data-menu-color="holiday"><span class="dot holiday"></span> Fiesta</button>
        <button data-menu-color="xxx"><span class="dot xxx"></span> XXX</button>
        <div class="sep"></div>
        <button data-menu-action="font-small">Texto más pequeño</button>
        <button data-menu-action="font-big">Texto más grande</button>
        <button data-menu-action="font-reset">Tamaño normal</button>
        <div class="sep"></div>
        <button data-menu-action="delete">Eliminar día</button>
        <button data-menu-action="insert">Insertar día</button>
        <button data-menu-action="fix">${rec.fixed ? "Desfijar día" : "Fijar día"}</button>`;
      menu.querySelectorAll("[data-menu-color]").forEach(button => button.addEventListener("click", () => {
        setDayColor(key, button.dataset.menuColor);
        closeDayMenu();
      }));
      menu.querySelector('[data-menu-action="delete"]').addEventListener("click", () => { shiftDay(key, "delete"); closeDayMenu(); });
      menu.querySelector('[data-menu-action="insert"]').addEventListener("click", () => { shiftDay(key, "insert"); closeDayMenu(); });
      menu.querySelector('[data-menu-action="fix"]').addEventListener("click", () => { toggleFixedDay(key); closeDayMenu(); });
      menu.querySelector('[data-menu-action="font-small"]').addEventListener("click", () => { changeDayFontSize(key, -1); closeDayMenu(); });
      menu.querySelector('[data-menu-action="font-big"]').addEventListener("click", () => { changeDayFontSize(key, 1); closeDayMenu(); });
      menu.querySelector('[data-menu-action="font-reset"]').addEventListener("click", () => { resetDayFontSize(key); closeDayMenu(); });
      menu.classList.add("open");
      const rect = menu.getBoundingClientRect();
      menu.style.left = `${Math.min(x, window.innerWidth - rect.width - 8)}px`;
      menu.style.top = `${Math.min(y, window.innerHeight - rect.height - 8)}px`;
    }

    function closeDayMenu() {
      $("dayMenu").classList.remove("open");
    }

    function toggleFixedDay(key) {
      const rec = getEntry(key);
      rec.fixed = !rec.fixed;
      markDirty();
      render();
    }

    function changeDayFontSize(key, delta) {
      const rec = getEntry(key);
      rec.fontSize = Math.max(8, Math.min(18, Number(rec.fontSize || 12) + delta));
      markDirty();
      render();
    }

    function resetDayFontSize(key) {
      const rec = getEntry(key);
      delete rec.fontSize;
      markDirty();
      render();
    }

    function shiftDay(key, mode) {
      ensureYear(state.currentYear);
      const slots = academicSlots().filter(day => !state.entries[state.currentYear][day]?.fixed);
      const idx = slots.indexOf(key);
      if (idx === -1) {
        updateStatus("Ese día no es una casilla móvil de clase.");
        return;
      }
      const entries = state.entries[state.currentYear];
      const movable = slots.slice(idx);
      const values = movable.map(day => cloneEntry(entries[day]));
      if (mode === "delete") {
        values.shift();
        values.push(undefined);
      } else {
        values.pop();
        values.unshift(undefined);
      }
      movable.forEach((day, i) => {
        if (values[i] && hasEntryData(values[i])) entries[day] = values[i];
        else delete entries[day];
      });
      markDirty();
      render();
    }

    function academicSlots() {
      const start = parseIso(`${getYearStart(state.currentYear)}-09-01`);
      const end = parseIso(`${getYearStart(state.currentYear) + 1}-07-31`);
      const days = [];
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const key = iso(d);
        if (state.classDays[mondayIndex(d)] && !state.holidays[state.currentYear]?.[key]) days.push(key);
      }
      return days;
    }

    function cloneEntry(entry) {
      if (!entry) return undefined;
      const copy = JSON.parse(JSON.stringify(entry));
      delete copy.fixed;
      return copy;
    }

    function hasEntryData(entry) {
      return !!entry && Object.keys(entry).some(key => entry[key] !== "" && entry[key] !== false && entry[key] != null);
    }

    function renderClassDays() {
      $("classDays").innerHTML = WEEKDAY_NAMES.map((name, i) => `
        <label><input type="checkbox" data-day="${i}" ${state.classDays[i] ? "checked" : ""}>${name.slice(0, 3)}</label>
      `).join("");
      $("classDays").querySelectorAll("input").forEach(input => {
        input.addEventListener("change", () => {
          state.classDays[Number(input.dataset.day)] = input.checked;
          markDirty();
          render();
        });
      });
    }

    function renderHolidayText() {
      ensureYear(state.currentYear);
      $("holidayText").value = Object.entries(state.holidays[state.currentYear])
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([date, name]) => `${date} | ${name}`)
        .join("\n");
    }

    function applyHolidayText() {
      const next = {};
      $("holidayText").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
        const [date, ...rest] = line.split("|");
        const key = date.trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(key)) next[key] = (rest.join("|").trim() || "No lectivo");
      });
      state.holidays[state.currentYear] = next;
      markDirty();
      render();
    }

    function resetOfficial() {
      state.holidays[state.currentYear] = Object.fromEntries((OFFICIAL_HOLIDAYS[state.currentYear] || []).map(([d, n]) => [d, n]));
      markDirty();
      render();
    }

    function markDirty() {
      if (loadingState) return;
      state.dirty = true;
      saveRecovery();
      scheduleAutoSave();
      updateStatus();
    }

    function updateStatus(msg = "") {
      const linked = state.fileName || "Sin archivo vinculado";
      const suffix = state.dirty ? (fileHandle ? " · autoguardado pendiente" : " · copia local pendiente de vincular") : " · guardado";
      $("fileStatus").textContent = `${linked}${suffix}`;
      if (msg) $("status").textContent = msg;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }

    function serializeMarkdown(includeVersion = true) {
      const copy = buildPersistedState(includeVersion);
      return `---\ntype: CalendarioMAT\nversion: 2\nsaved: ${new Date().toISOString()}\n---\n\n# Calendario Matemáticas MAE NS\n\n\`\`\`json\n${JSON.stringify(copy, null, 2)}\n\`\`\`\n`;
    }

    function buildPersistedState(includeVersion = true) {
      const copy = snapshotCurrentState();
      copy.fileName = state.fileName;
      copy.history = includeVersion ? nextHistory() : (state.history || []);
      return copy;
    }

    function snapshotCurrentState() {
      return {
        version: 2,
        currentYear: state.currentYear,
        classDays: structuredClone(state.classDays),
        holidays: structuredClone(state.holidays),
        entries: structuredClone(state.entries),
        arrows: structuredClone(state.arrows),
        collapsedMonths: structuredClone(state.collapsedMonths),
        zoom: state.zoom
      };
    }

    function snapshotSignature(snapshot = snapshotCurrentState()) {
      return JSON.stringify({
        currentYear: snapshot.currentYear,
        classDays: snapshot.classDays,
        holidays: snapshot.holidays,
        entries: snapshot.entries,
        arrows: snapshot.arrows,
        collapsedMonths: snapshot.collapsedMonths,
        zoom: snapshot.zoom
      });
    }

    function nextHistory() {
      const current = snapshotCurrentState();
      const signature = snapshotSignature(current);
      const history = Array.isArray(state.history) ? structuredClone(state.history) : [];
      if (!history[0] || history[0].signature !== signature) {
        history.unshift({
          id: `v-${Date.now()}`,
          saved: new Date().toISOString(),
          year: state.currentYear,
          signature,
          snapshot: current
        });
      }
      return history.slice(0, HISTORY_LIMIT);
    }

    function commitHistoryFromSerialized(text) {
      const data = parseMarkdownData(text);
      state.history = Array.isArray(data.history) ? data.history : [];
      lastSavedSignature = snapshotSignature();
    }

    function saveRecovery() {
      try {
        localStorage.setItem(RECOVERY_KEY, serializeMarkdown(false));
      } catch (err) {
        console.warn(err);
      }
    }

    function clearRecovery() {
      try {
        localStorage.removeItem(RECOVERY_KEY);
      } catch (err) {
        console.warn(err);
      }
    }

    function scheduleAutoSave() {
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => autoSave(false), AUTOSAVE_DELAY);
    }

    async function autoSave(forcePicker = false) {
      if (autoSaveRunning) {
        pendingAutoSave = true;
        return;
      }
      if (!fileHandle && !forcePicker) {
        updateStatus("Cambios guardados como recuperación local. Pulsa Guardar para vincular el archivo .vconce.");
        return;
      }
      autoSaveRunning = true;
      try {
        await saveFile(forcePicker, true);
      } finally {
        autoSaveRunning = false;
        if (pendingAutoSave) {
          pendingAutoSave = false;
          scheduleAutoSave();
        }
      }
    }

    function parseMarkdownData(text) {
      const match = text.match(/```json\s*([\s\S]*?)```/);
      return JSON.parse(match ? match[1] : text);
    }

    function exportMonthModels() {
      ensureYear(state.currentYear);
      return MONTHS.map(([name, month]) => {
        const dates = monthDates(state.currentYear, month);
        const weeks = [];
        for (let i = 0; i < dates.length; i += 7) {
          const week = dates.slice(i, i + 7);
          const weekStart = iso(week[0]);
          const weekEnd = iso(week[6]);
          const arrows = (state.arrows[state.currentYear] || [])
            .filter(a => a.start <= weekEnd && a.end >= weekStart)
            .filter(a => visibleArrowSegmentsForWeek(a, week, month).length > 0)
            .sort((a, b) => (Number(a.lane || 1) - Number(b.lane || 1)) || a.start.localeCompare(b.start));
          weeks.push({ weekStart, weekEnd, days: week.map(date => exportDayModel(date, month)), arrows });
        }
        return { name, month, weeks };
      });
    }

    function exportDayModel(date, month) {
      const key = iso(date);
      const entry = state.entries[state.currentYear][key] || {};
      return {
        key,
        day: date.getDate(),
        outside: date.getMonth() !== month,
        holiday: state.holidays[state.currentYear]?.[key] || "",
        event: OFFICIAL_EVENTS[state.currentYear]?.[key] || "",
        content: entry.content || "",
        problems: entry.problems || "",
        color: entry.color || ""
      };
    }

    function currentExportLayout() {
      return Math.max(1, Math.min(2, Number($("exportLayout")?.value || 1)));
    }

    function groupedMonths(months, perSheet = currentExportLayout()) {
      const size = Math.max(1, Math.min(2, Number(perSheet || 1)));
      const groups = [];
      for (let i = 0; i < months.length; i += size) groups.push(months.slice(i, i + size));
      return groups;
    }

    function printPdf() {
      const months = exportMonthModels();
      const doc = window.open("", "_blank");
      if (!doc) {
        updateStatus("El navegador ha bloqueado la ventana de impresión.");
        return;
      }
      doc.document.write(monthPrintDocument(months, currentExportLayout()));
      doc.document.close();
      doc.focus();
      setTimeout(() => doc.print(), 250);
    }

    function monthPrintDocument(months, perSheet = 1) {
      return `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Calendario Matemáticas MAE NS ${state.currentYear}</title>
        <style>
          @page { size: A4 landscape; margin: 8mm; }
          body { font-family: "Segoe UI", Arial, sans-serif; color: #18202f; margin: 0; }
          .month-page { page-break-after: always; height: 190mm; display: grid; gap: 5mm; }
          .month-page.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          .month-page:last-child { page-break-after: auto; }
          .month-print { min-width: 0; display: flex; flex-direction: column; gap: 2mm; }
          h1 { font-size: ${perSheet === 2 ? "13pt" : "18pt"}; margin: 0; }
          .meta { color: #657083; font-size: 9pt; }
          table { width: 100%; border-collapse: collapse; table-layout: fixed; flex: 1; }
          th, td { border: 1.2pt solid #6f7a8a; vertical-align: top; padding: ${perSheet === 2 ? "1.1mm" : "2mm"}; overflow-wrap: anywhere; }
          th { height: 6mm; font-size: ${perSheet === 2 ? "7pt" : "9pt"}; background: #eef2f8; text-align: center; }
          td { height: ${perSheet === 2 ? "14mm" : "23mm"}; font-size: ${perSheet === 2 ? "5.8pt" : "7.2pt"}; }
          .outside { background: #eef1f6; color: #8993a3; }
          .holiday { background: #e8ddff; }
          .exercise { background: #dff3df; }
          .exam { background: #ffdada; }
          .xxx { background: #fff2a8; }
          .num { font-weight: 800; font-size: 9pt; }
          .small { color: #657083; font-size: 6.8pt; }
          .section { margin-top: 1mm; white-space: pre-wrap; }
          .problems { border-top: 1px dashed #9aa7ba; margin-top: 1mm; padding-top: 1mm; }
          .arrow-row td { height: ${perSheet === 2 ? "5mm" : "8mm"}; padding: .7mm 1mm; background: #fbfcfe; }
          .arrow { display: inline-block; margin: .3mm .7mm .3mm 0; padding: .7mm 1.8mm; border: 1px solid rgba(0,0,0,.25); border-radius: 2px; font-weight: 700; font-size: ${perSheet === 2 ? "5.5pt" : "7pt"}; }
        </style></head><body>${groupedMonths(months, perSheet).map(group => `<section class="month-page ${perSheet === 2 ? "two" : "one"}">${group.map(monthPrintHtml).join("")}</section>`).join("")}</body></html>`;
    }

    function monthPrintHtml(month) {
      return `<section class="month-print"><header><h1>${escapeHtml(month.name)} ${escapeHtml(state.currentYear)}</h1><div class="meta">Calendario Matemáticas MAE NS</div></header><table><thead><tr>${WEEKDAYS.map(w => `<th>${w}</th>`).join("")}</tr></thead><tbody>${month.weeks.map(week => `${weekArrowsPrintHtml(week)}<tr>${week.days.map(dayPrintHtml).join("")}</tr>`).join("")}</tbody></table></section>`;
    }

    function weekArrowsPrintHtml(week) {
      const arrows = week.arrows || [];
      if (!arrows.length) return `<tr class="arrow-row">${WEEKDAYS.map(() => `<td></td>`).join("")}</tr>`;
      return `<tr class="arrow-row"><td colspan="7">${arrows.map(a => `<span class="arrow" style="background:${escapeHtml(a.color || "#ffffff")}">${escapeHtml(a.text)} · ${escapeHtml(a.start)}-${escapeHtml(a.end)}</span>`).join("")}</td></tr>`;
    }

    function dayPrintHtml(day) {
      const classes = [day.outside && "outside", day.holiday && "holiday", day.color].filter(Boolean).join(" ");
      const labels = [day.holiday, day.event].filter(Boolean).map(x => `<div class="small">${escapeHtml(x)}</div>`).join("");
      return `<td class="${classes}"><div class="num">${day.day}</div>${labels}<div class="section">${escapeHtml(day.content || " ")}</div><div class="section problems">${escapeHtml(day.problems || " ")}</div></td>`;
    }

    function expandAllMonths() {
      ensureYear(state.currentYear);
      MONTHS.forEach(([, month]) => { state.collapsedMonths[state.currentYear][String(month)] = false; });
      markDirty();
      render();
    }

    function exportDocx() {
      const months = exportMonthModels();
      const perSheet = currentExportLayout();
      const groups = groupedMonths(months, perSheet);
      const body = groups.map((group, index) => group.map(month => docxMonthTable(month, perSheet === 2)).join("") + (index < groups.length - 1 ? '<w:p><w:r><w:br w:type="page"/></w:r></w:p>' : '')).join("");
      const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/><w:pgMar w:top="450" w:right="450" w:bottom="450" w:left="450"/></w:sectPr></w:body></w:document>`;
      const files = {
        "[Content_Types].xml": `<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`,
        "_rels/.rels": `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`,
        "word/document.xml": documentXml
      };
      downloadBlob(makeZip(files), `CalendarioMAT-${state.currentYear}.docx`, "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
    }

    function docxMonthTable(month, compact = false) {
      const titleSize = compact ? "24" : "32";
      return `<w:p><w:r><w:rPr><w:b/><w:sz w:val="${titleSize}"/></w:rPr><w:t>${escapeXml(month.name)} ${escapeXml(state.currentYear)}</w:t></w:r></w:p><w:tbl>${docxTableProps(compact)}<w:tr>${WEEKDAYS.map(w => docxCell(w, { header: true, compact })).join("")}</w:tr>${month.weeks.map(week => docxArrowRow(week, compact) + docxDayRow(week, compact)).join("")}</w:tbl>`;
    }

    function docxTableProps(compact = false) {
      const width = compact ? "1900" : "2200";
      return `<w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="10"/><w:left w:val="single" w:sz="10"/><w:bottom w:val="single" w:sz="10"/><w:right w:val="single" w:sz="10"/><w:insideH w:val="single" w:sz="6"/><w:insideV w:val="single" w:sz="6"/></w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid>${WEEKDAYS.map(() => `<w:gridCol w:w="${width}"/>`).join("")}</w:tblGrid>`;
    }

    function docxArrowRow(week, compact = false) {
      const text = (week.arrows || []).map(a => `${a.text} (${a.start}-${a.end})`).join(" · ") || " ";
      return `<w:tr>${docxCell(text, { colspan: 7, shade: "FBFCFE", small: true, compact })}</w:tr>`;
    }

    function docxDayRow(week, compact = false) {
      return `<w:tr>${week.days.map(day => docxCell(`${day.day}\n${[day.holiday, day.event].filter(Boolean).join(" · ")}\n${day.content || " "}\n---\n${day.problems || " "}`, { shade: docxShade(day), compact })).join("")}</w:tr>`;
    }

    function docxShade(day) {
      if (day.color === "exam") return "FFDADA";
      if (day.color === "exercise") return "DFF3DF";
      if (day.color === "xxx") return "FFF2A8";
      if (day.holiday || day.color === "holiday") return "E8DDFF";
      if (day.outside) return "EEF1F6";
      return "FFFFFF";
    }

    function docxCell(text, options = {}) {
      const span = options.colspan ? `<w:gridSpan w:val="${options.colspan}"/>` : "";
      const shade = options.shade ? `<w:shd w:fill="${options.shade}"/>` : "";
      const header = options.header ? `<w:shd w:fill="EEF2F8"/>` : shade;
      const size = options.compact ? (options.small ? "11" : options.header ? "14" : "11") : options.small ? "14" : options.header ? "18" : "15";
      const width = options.compact ? "1900" : "2200";
      const paras = String(text).split("\n").map(line => `<w:p><w:r><w:rPr>${options.header ? "<w:b/>" : ""}<w:sz w:val="${size}"/></w:rPr><w:t xml:space="preserve">${escapeXml(line || " ")}</w:t></w:r></w:p>`).join("");
      return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${span}${header}<w:tcBorders><w:top w:val="single" w:sz="6"/><w:left w:val="single" w:sz="6"/><w:bottom w:val="single" w:sz="6"/><w:right w:val="single" w:sz="6"/></w:tcBorders><w:vAlign w:val="top"/></w:tcPr>${paras}</w:tc>`;
    }

    function docxParagraph(text, style = "") {
      const styleXml = style ? `<w:pPr><w:pStyle w:val="${style}"/></w:pPr>` : "";
      return `<w:p>${styleXml}<w:r><w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r></w:p>`;
    }

    function docxMultiline(text) {
      return String(text).split("\n").map(line => docxParagraph(line || " "));
    }

    function exportExcel() {
      const months = exportMonthModels();
      const perSheet = currentExportLayout();
      const html = excelDocument(months, perSheet);
      const blob = new Blob(["\ufeff", html], { type: "application/vnd.ms-excel;charset=utf-8" });
      downloadBlob(blob, `CalendarioMAT-${state.currentYear}.xls`);
    }

    function excelDocument(months, perSheet = 1) {
      return `<!doctype html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>
        body { font-family: "Segoe UI", Arial, sans-serif; }
        .sheet { page-break-after: always; }
        .sheet:last-child { page-break-after: auto; }
        .sheet-layout { border-collapse: collapse; width: 100%; table-layout: fixed; }
        .sheet-layout > tbody > tr > td { border: 0; vertical-align: top; padding: 0 10px 0 0; }
        .month-table { border-collapse: collapse; width: 100%; table-layout: fixed; margin-bottom: 18px; }
        .month-title { font-size: 18pt; font-weight: 700; background: #f8fafc; border: 2px solid #4b5567; text-align: left; }
        .weekday { font-weight: 700; text-align: center; background: #eef2f8; }
        .month-table th, .month-table td { border: 1px solid #6f7a8a; vertical-align: top; mso-number-format:"\\@"; white-space: normal; }
        .month-table th { height: 22px; }
        .day-cell { height: ${perSheet === 2 ? "78px" : "116px"}; font-size: ${perSheet === 2 ? "8pt" : "9pt"}; }
        .arrow-cell { height: 24px; background: #fbfcfe; font-size: 8pt; font-weight: 700; }
        .outside { background: #eef1f6; color: #8993a3; }
        .holiday { background: #e8ddff; }
        .exercise { background: #dff3df; }
        .exam { background: #ffdada; }
        .xxx { background: #fff2a8; }
        .num { font-weight: 800; font-size: 11pt; }
        .small { color: #657083; font-size: 8pt; }
        .section { margin-top: 3px; }
        .problems { border-top: 1px dashed #9aa7ba; margin-top: 4px; padding-top: 3px; color: #38445a; }
        .arrow { display: inline-block; border: 1px solid #6f7a8a; padding: 2px 5px; margin-right: 4px; font-weight: 700; }
      </style></head><body>${groupedMonths(months, perSheet).map(group => excelSheetHtml(group, perSheet)).join("")}</body></html>`;
    }

    function excelSheetHtml(group, perSheet) {
      if (perSheet === 2) {
        return `<div class="sheet"><table class="sheet-layout"><tbody><tr>${group.map(month => `<td>${excelMonthHtml(month)}</td>`).join("")}${group.length === 1 ? "<td></td>" : ""}</tr></tbody></table></div>`;
      }
      return `<div class="sheet">${group.map(excelMonthHtml).join("")}</div>`;
    }

    function excelMonthHtml(month) {
      return `<table class="month-table"><thead><tr><th class="month-title" colspan="7">${escapeHtml(month.name)} ${escapeHtml(state.currentYear)}</th></tr><tr>${WEEKDAYS.map(w => `<th class="weekday">${escapeHtml(w)}</th>`).join("")}</tr></thead><tbody>${month.weeks.map(week => `${excelArrowRowHtml(week)}<tr>${week.days.map(excelDayHtml).join("")}</tr>`).join("")}</tbody></table>`;
    }

    function excelArrowRowHtml(week) {
      const arrows = week.arrows || [];
      const text = arrows.length ? arrows.map(a => `<span class="arrow" style="background:${escapeHtml(a.color || "#ffffff")}">${escapeHtml(a.text || "Flecha")} (${escapeHtml(a.start)}-${escapeHtml(a.end)})</span>`).join("") : " ";
      return `<tr><td class="arrow-cell" colspan="7">${text}</td></tr>`;
    }

    function excelDayHtml(day) {
      const classes = ["day-cell", day.outside && "outside", day.holiday && "holiday", day.color].filter(Boolean).join(" ");
      const labels = [day.holiday, day.event].filter(Boolean).map(x => `<div class="small">${escapeHtml(x)}</div>`).join("");
      return `<td class="${classes}"><div class="num">${day.day}</div>${labels}<div class="section">${escapeHtml(day.content || " ")}</div><div class="section problems">${escapeHtml(day.problems || " ")}</div></td>`;
    }

    function escapeXml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[ch]));
    }

    function makeZip(files) {
      const encoder = new TextEncoder();
      const chunks = [];
      const central = [];
      let offset = 0;
      Object.entries(files).forEach(([name, text]) => {
        const nameBytes = encoder.encode(name);
        const data = encoder.encode(text);
        const crc = crc32(data);
        const local = zipHeader(0x04034b50, 30, nameBytes, data, crc, offset);
        chunks.push(local, data);
        central.push(zipHeader(0x02014b50, 46, nameBytes, data, crc, offset));
        offset += local.length + data.length;
      });
      const centralOffset = offset;
      central.forEach(c => { chunks.push(c); offset += c.length; });
      const end = new Uint8Array(22);
      const view = new DataView(end.buffer);
      view.setUint32(0, 0x06054b50, true);
      view.setUint16(8, central.length, true);
      view.setUint16(10, central.length, true);
      view.setUint32(12, offset - centralOffset, true);
      view.setUint32(16, centralOffset, true);
      chunks.push(end);
      return new Blob(chunks, { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    }

    function zipHeader(signature, size, nameBytes, data, crc, localOffset) {
      const extra = signature === 0x02014b50 ? 16 : 0;
      const out = new Uint8Array(size + nameBytes.length);
      const v = new DataView(out.buffer);
      v.setUint32(0, signature, true);
      if (signature === 0x02014b50) {
        v.setUint16(4, 20, true); v.setUint16(6, 20, true); v.setUint16(28, nameBytes.length, true);
        v.setUint32(16, crc, true); v.setUint32(20, data.length, true); v.setUint32(24, data.length, true); v.setUint32(42, localOffset, true);
      } else {
        v.setUint16(4, 20, true); v.setUint16(26, nameBytes.length, true);
        v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true);
      }
      out.set(nameBytes, size);
      return out;
    }

    function crc32(data) {
      let crc = -1;
      for (let i = 0; i < data.length; i++) {
        crc ^= data[i];
        for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
      }
      return (crc ^ -1) >>> 0;
    }

    function renderVersionList() {
      const list = $("versionList");
      if (!list) return;
      const versions = Array.isArray(state.history) ? state.history : [];
      if (!versions.length) {
        list.innerHTML = `<div class="status">Todavía no hay versiones guardadas en este archivo.</div>`;
        return;
      }
      list.innerHTML = versions.map((version, index) => {
        const date = new Date(version.saved);
        const label = Number.isNaN(date.getTime()) ? version.saved : date.toLocaleString("es-ES");
        const current = index === 0 ? "Actual" : `Versión ${versions.length - index}`;
        return `<div class="version-item">
          <div><strong>${escapeHtml(current)}</strong><span>${escapeHtml(label)} · ${escapeHtml(version.year || "")}</span></div>
          <button type="button" data-restore-version="${escapeHtml(version.id)}"${index === 0 ? " disabled" : ""}>Restaurar</button>
        </div>`;
      }).join("");
      list.querySelectorAll("[data-restore-version]").forEach(button => {
        button.addEventListener("click", () => restoreVersion(button.dataset.restoreVersion));
      });
    }

    function restoreVersion(id) {
      const version = (state.history || []).find(item => item.id === id);
      if (!version?.snapshot) return;
      if (!confirm("Restaurar esta versión anterior? El estado actual quedará guardado como una versión más.")) return;
      const currentVersion = {
        id: `v-${Date.now()}`,
        saved: new Date().toISOString(),
        year: state.currentYear,
        signature: snapshotSignature(),
        snapshot: snapshotCurrentState()
      };
      const restored = structuredClone(version.snapshot);
      loadingState = true;
      state.version = restored.version || 2;
      state.currentYear = restored.currentYear || state.currentYear;
      state.classDays = restored.classDays || state.classDays;
      state.holidays = restored.holidays || {};
      state.entries = restored.entries || {};
      state.arrows = restored.arrows || {};
      state.collapsedMonths = restored.collapsedMonths || {};
      state.zoom = restored.zoom || 100;
      state.history = [currentVersion, ...(state.history || []).filter(item => item.id !== currentVersion.id)].slice(0, HISTORY_LIMIT);
      state.useDefaultCollapse = false;
      state.dirty = false;
      ensureYear(state.currentYear);
      loadingState = false;
      markDirty();
      render();
      renderVersionList();
      updateStatus("Versión restaurada. Se autoguardará en el archivo vinculado.");
    }

    function loadMarkdown(text, fileName = "") {
      const data = parseMarkdownData(text);
      loadingState = true;
      state.version = data.version || 1;
      state.currentYear = data.currentYear || currentAcademicYear();
      state.classDays = Array.isArray(data.classDays) ? data.classDays : state.classDays;
      state.holidays = data.holidays || {};
      state.entries = data.entries || {};
      state.arrows = data.arrows || {};
      state.collapsedMonths = data.collapsedMonths || {};
      state.zoom = data.zoom || 100;
      state.history = Array.isArray(data.history) ? data.history : [];
      state.useDefaultCollapse = !Object.prototype.hasOwnProperty.call(data, "collapsedMonths");
      state.fileName = fileName || data.fileName || state.fileName;
      state.dirty = false;
      ensureYear(state.currentYear);
      lastSavedSignature = snapshotSignature();
      loadingState = false;
      clearRecovery();
      render();
      renderVersionList();
      updateStatus("Archivo cargado.");
    }

    async function saveFile(forcePicker = false, silent = false) {
      const text = serializeMarkdown();
      if ("showSaveFilePicker" in window) {
        try {
          if (!fileHandle || forcePicker) {
            fileHandle = await window.showSaveFilePicker({
              suggestedName: state.fileName || "CalendarioMAT.vconce",
              types: [{ description: "Calendario Matemáticas MAE NS", accept: { "text/markdown": [".vconce"] } }]
            });
            await saveHandle(fileHandle);
          }
          const writable = await fileHandle.createWritable();
          await writable.write(text);
          await writable.close();
          state.fileName = fileHandle.name.endsWith(".vconce") ? fileHandle.name : "CalendarioMAT.vconce";
          commitHistoryFromSerialized(text);
          state.dirty = false;
          clearRecovery();
          renderVersionList();
          updateStatus(silent ? "Autoguardado." : "Guardado.");
          return;
        } catch (err) {
          if (err.name === "AbortError") return;
          console.warn(err);
          if (silent) {
            state.dirty = true;
            updateStatus("No se ha podido autoguardar. Pulsa Guardar para volver a vincular el archivo.");
            return;
          }
        }
      }
      if (silent) {
        state.dirty = true;
        updateStatus("El navegador no permite autoguardado directo. Pulsa Guardar para descargar una copia.");
        return;
      }
      downloadText(text, state.fileName || "CalendarioMAT.vconce");
      commitHistoryFromSerialized(text);
      state.dirty = false;
      clearRecovery();
      renderVersionList();
      updateStatus("Copia descargada. Para autoguardar sin descargas, abre la página en un navegador compatible y vincula el archivo.");
    }

    async function openFilePicker() {
      if ("showOpenFilePicker" in window) {
        try {
          const [handle] = await window.showOpenFilePicker({
            types: [{ description: "Calendario Matemáticas MAE NS", accept: { "text/markdown": [".vconce", ".md"] } }],
            multiple: false
          });
          fileHandle = handle;
          await saveHandle(handle);
          const file = await handle.getFile();
          loadMarkdown(await file.text(), file.name);
          return;
        } catch (err) {
          if (err.name === "AbortError") return;
          console.warn(err);
        }
      }
      $("fileInput").click();
    }

    function downloadText(text, name) {
      const filename = name.endsWith(".vconce") ? name : name.replace(/\.[^.]+$/, "") + ".vconce";
      const blob = new Blob([text], { type: "text/markdown;charset=utf-8" });
      downloadBlob(blob, filename);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function getDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("handles");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveHandle(handle) {
      const db = await getDb();
      await new Promise((resolve, reject) => {
        const tx = db.transaction("handles", "readwrite");
        tx.objectStore("handles").put(handle, HANDLE_KEY);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadHandle() {
      const db = await getDb();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("handles", "readonly");
        const req = tx.objectStore("handles").get(HANDLE_KEY);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function autoLoad() {
      ensureYear(state.currentYear);
      try {
        if ("showOpenFilePicker" in window && "indexedDB" in window) {
          const handle = await loadHandle();
          if (handle) {
            const permission = await handle.queryPermission({ mode: "readwrite" });
            if (permission === "granted" || await handle.requestPermission({ mode: "readwrite" }) === "granted") {
              fileHandle = handle;
              const file = await handle.getFile();
              loadMarkdown(await file.text(), file.name);
              return;
            }
          }
        }
      } catch (err) {
        console.warn(err);
      }
      try {
        const recovery = localStorage.getItem(RECOVERY_KEY);
        if (recovery && confirm("Hay cambios recuperados que no estaban vinculados a un archivo. ¿Quieres cargarlos?")) {
          loadMarkdown(recovery, state.fileName || "");
          updateStatus("Recuperación local cargada. Pulsa Guardar para vincularla al .vconce.");
          return;
        }
      } catch (err) {
        console.warn(err);
      }
      render();
      renderVersionList();
      setTimeout(() => {
        if (!state.fileName && confirm("No encuentro un CalendarioMAT.vconce vinculado. ¿Quieres cargar uno?")) openFilePicker();
      }, 250);
    }

    document.querySelectorAll("[data-color]").forEach(button => {
      button.addEventListener("click", () => {
        activeColor = button.dataset.color;
        document.querySelectorAll("[data-color]").forEach(b => b.classList.toggle("active", b === button));
      });
    });
    $("yearSelect").addEventListener("change", () => {
      state.currentYear = $("yearSelect").value;
      ensureYear(state.currentYear);
      selectedDays.clear();
      lastSelectionDate = null;
      markDirty();
      render();
    });
    $("zoomSlider").addEventListener("input", () => {
      state.zoom = Number($("zoomSlider").value);
      applyZoom();
      markDirty();
    });
    $("saveBtn").addEventListener("click", () => saveFile(false));
    $("selectModeBtn").addEventListener("click", () => setSelectionMode(!selectionMode));
    $("deleteSelectedBtn").addEventListener("click", deleteSelectedDays);
    $("clearSelectionBtn").addEventListener("click", clearSelection);
    $("openBtn").addEventListener("click", openFilePicker);
    $("exportBtn").addEventListener("click", (event) => {
      event.stopPropagation();
      $("exportMenu").hidden = !$("exportMenu").hidden;
    });
    $("exportPdfBtn").addEventListener("click", () => {
      $("exportMenu").hidden = true;
      printPdf();
    });
    $("exportDocxBtn").addEventListener("click", () => {
      $("exportMenu").hidden = true;
      exportDocx();
    });
    $("exportExcelBtn").addEventListener("click", () => {
      $("exportMenu").hidden = true;
      exportExcel();
    });
    $("expandAllBtn").addEventListener("click", expandAllMonths);
    $("versionsBtn").addEventListener("click", () => {
      const list = $("versionList");
      list.hidden = !list.hidden;
      if (!list.hidden) renderVersionList();
    });
    $("downloadBtn").addEventListener("click", () => {
      const text = serializeMarkdown();
      commitHistoryFromSerialized(text);
      renderVersionList();
      downloadText(text, state.fileName || "CalendarioMAT.vconce");
    });
    $("settingsBtn").addEventListener("click", () => $("drawer").classList.add("open"));
    $("closeSettings").addEventListener("click", () => $("drawer").classList.remove("open"));
    $("shade").addEventListener("click", () => $("drawer").classList.remove("open"));
    $("applyHolidays").addEventListener("click", applyHolidayText);
    $("resetOfficial").addEventListener("click", resetOfficial);
    $("addArrow").addEventListener("click", addArrow);
    $("arrowColor").addEventListener("input", () => syncArrowColorPresetState($("arrowColorPresets"), $("arrowColor").value));
    $("quickArrowBtn").addEventListener("click", quickAddArrow);
    document.addEventListener("click", (event) => {
      if (!event.target.closest("#dayMenu") && !event.target.closest(".day-top")) closeDayMenu();
      if (!event.target.closest("#arrowMenu") && !event.target.closest(".topic-arrow")) closeArrowMenu();
      if (!event.target.closest(".export-wrap")) $("exportMenu").hidden = true;
    });
    $("newYearBtn").addEventListener("click", () => {
      if (confirm(`Vaciar el contenido editable de ${state.currentYear}?`)) {
        state.entries[state.currentYear] = {};
        state.arrows[state.currentYear] = [];
        markDirty();
        render();
      }
    });
    $("fileInput").addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      loadMarkdown(await file.text(), file.name);
      event.target.value = "";
    });
    window.addEventListener("beforeunload", (event) => {
      if (!state.dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });
    window.addEventListener("pointermove", updateArrowDrag);
    window.addEventListener("pointerup", finishArrowDrag);
    window.addEventListener("pointercancel", finishArrowDrag);
    let resizeRenderTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeRenderTimer);
      resizeRenderTimer = setTimeout(render, 120);
    });

    updateSelectionUi();
    renderArrowFormPresets();
    autoLoad();
  </script>
</body>
