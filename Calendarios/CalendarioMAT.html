  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --ink: #18202f;
      --muted: #657083;
      --line: #ccd3df;
      --line-strong: #9aa7ba;
      --brand: #1b665f;
      --brand-2: #184d85;
      --weekend: #d8dde6;
      --outside: #eef1f6;
      --holiday: #e8ddff;
      --exercise: #dff3df;
      --exam: #ffdada;
      --xxx: #fff2a8;
      --warn: #fff2c9;
      --shadow: 0 12px 30px rgba(24, 32, 47, .12);
      --calendar-zoom: 1;
      --calendar-density: 1;
      --calendar-scale: 1;
      --calendar-layout-width: 100%;
      --weekday-min: calc(88px * var(--calendar-density));
      --weekend-min: calc(26px * var(--calendar-density));
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, select, input, textarea { font: inherit; }
    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 11px;
      cursor: pointer;
      line-height: 1;
    }
    button:hover { border-color: var(--line-strong); }
    button.primary { background: var(--brand); color: white; border-color: var(--brand); }
    button.ghost { background: transparent; }
    button.icon { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; }
    select, input[type="text"], input[type="date"], input[type="color"] {
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      padding: 0 10px;
      color: var(--ink);
    }
    input[type="color"] { width: 48px; padding: 3px; }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(245, 247, 251, .96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .bar-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    .title {
      display: flex;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }
    .brand-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      opacity: .72;
      flex: 0 0 auto;
    }
    h1 { margin: 0; font-size: 19px; line-height: 1.15; letter-spacing: 0; }
    .subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: visible;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
    }
    .zoom-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
    }
    .zoom-control input { width: 92px; accent-color: var(--brand); }
    .zoom-control output {
      width: 34px;
      color: var(--ink);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .tool-segment {
      display: inline-flex;
      background: #e9edf4;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }
    .tool-segment button {
      border: 0;
      background: transparent;
      padding: 7px 9px;
      border-radius: 5px;
    }
    .tool-segment button.active { background: white; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .dot {
      width: 14px;
      height: 14px;
      border: 1px solid rgba(0,0,0,.2);
      border-radius: 50%;
      display: inline-block;
      vertical-align: -2px;
      margin-right: 5px;
    }
    .dot.blank { background: #fff; }
    .dot.exercise { background: var(--exercise); }
    .dot.exam { background: var(--exam); }
    .dot.holiday { background: var(--holiday); }
    .dot.xxx { background: var(--xxx); }
    .export-wrap { position: relative; display: inline-flex; }
    .export-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 70;
      min-width: 230px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      display: grid;
      gap: 8px;
    }
    .export-menu[hidden] { display: none; }
    .export-menu label {
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .export-menu select {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--ink);
      padding: 0 8px;
    }
    .export-menu button { justify-content: flex-start; }

    main {
      max-width: 1800px;
      margin: 0 auto;
      padding: calc(18px * var(--calendar-density)) 16px 36px;
      overflow-x: hidden;
    }
    .months {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: calc(18px * var(--calendar-density));
      align-items: start;
      width: var(--calendar-layout-width);
      transform: scale(var(--calendar-scale));
      transform-origin: top left;
    }
    .month-column {
      display: grid;
      gap: calc(18px * var(--calendar-density));
      align-content: start;
      min-width: 0;
    }
    .month {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(24, 32, 47, .05);
      overflow: visible;
    }
    .month:not(.collapsed) { margin: 0; }
    .month-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(10px * var(--calendar-density)) calc(12px * var(--calendar-density));
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      cursor: pointer;
      user-select: none;
    }
    .month-head:hover { background: #eef3f8; }
    .month-title { font-size: calc(16px * var(--calendar-zoom)); font-weight: 750; }
    .month-count { font-size: calc(12px * var(--calendar-zoom)); color: var(--muted); }
    .month-toggle {
      display: inline-grid;
      place-items: center;
      width: calc(20px * var(--calendar-density));
      height: calc(20px * var(--calendar-density));
      margin-right: calc(7px * var(--calendar-density));
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
      font-size: 12px;
      color: var(--muted);
    }
    .month.collapsed {
      align-self: start;
      width: 100%;
      box-shadow: none;
      border-radius: 0;
      margin: 0;
    }
    .month.collapsed .weekdays,
    .month.collapsed .grid,
    .month.collapsed .arrows {
      display: none !important;
    }
    .month.collapsed .month-head { border-bottom: 0; }
    .weekdays {
      display: grid;
      grid-template-columns: repeat(5, minmax(var(--weekday-min), 1fr)) repeat(2, minmax(var(--weekend-min), .22fr));
    }
    .grid { display: grid; gap: 0; }
    .week-row {
      display: grid;
      grid-template-columns: repeat(5, minmax(var(--weekday-min), 1fr)) repeat(2, minmax(var(--weekend-min), .22fr));
      grid-template-rows: auto auto auto repeat(var(--arrow-lanes, 1), calc(24px * var(--calendar-density)));
      border-bottom: 1px solid var(--line);
      position: relative;
      overflow: visible;
    }
    .weekdays div {
      padding: calc(7px * var(--calendar-density)) calc(6px * var(--calendar-density));
      text-align: center;
      font-size: calc(12px * var(--calendar-zoom));
      font-weight: 700;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background: #fbfcfe;
    }
    .weekdays div:nth-child(6),
    .weekdays div:nth-child(7) { background: var(--weekend); }
    .weekdays div:nth-child(7) { border-right: 0; }
    .day {
      min-height: 0;
      border-right: 1px solid var(--line);
      border-bottom: 0;
      background: white;
      display: contents;
      position: relative;
    }
    .day:nth-child(7n) .day-cell { border-right: 3px solid var(--line-strong); }
    .day-cell {
      border-left: 3px solid var(--line-strong);
      border-right: 3px solid var(--line-strong);
      background: white;
      min-width: 0;
    }
    .day.outside .day-cell { background: var(--outside); color: #8993a3; }
    .day.weekend .day-cell { background: var(--weekend); }
    .day.holiday .day-cell { background: var(--holiday); }
    .day.exercise .day-cell { background: var(--exercise); }
    .day.exam .day-cell { background: var(--exam); }
    .day.xxx .day-cell { background: var(--xxx); }
    .day.weekend .day-cell { background: var(--weekend) !important; }
    .day.fixed .day-cell { box-shadow: inset 0 0 0 2px rgba(24,32,47,.38); }
    .day.selected .day-cell { box-shadow: inset 0 0 0 3px #2563eb; }
    .day.drag-over .day-cell { box-shadow: inset 0 0 0 3px #f97316; }
    .day-select-toggle {
      display: none;
      position: absolute;
      top: 3px;
      right: 3px;
      z-index: 8;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 2px solid #2563eb;
      border-radius: 3px;
      background: #ffffff;
      color: #ffffff;
      font-size: 12px;
      line-height: 12px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    body.selection-mode .day-select-toggle { display: inline-flex; }
    .day.selected .day-select-toggle { background: #2563eb; }
    .selection-actions { display: none; gap: 6px; align-items: center; }
    body.selection-mode .selection-actions { display: inline-flex; }
    #selectModeBtn.active { background: #dbeafe; border-color: #2563eb; color: #1d4ed8; }
    #selectionCount { color: var(--muted); font-size: 12px; min-width: 58px; }
    .day.not-class textarea { opacity: .82; }
    .day.weekend textarea {
      padding-left: 2px;
      padding-right: 2px;
      font-size: calc(10px * var(--calendar-zoom));
    }
    .day.weekend .badge { display: none; }
    .day.weekend .num {
      min-width: 0;
      font-size: calc(11px * var(--calendar-zoom));
    }
    .day-top {
      min-height: calc(29px * var(--calendar-density));
      display: flex;
      align-items: center;
      gap: 5px;
      padding: calc(5px * var(--calendar-density)) calc(6px * var(--calendar-density)) calc(3px * var(--calendar-density));
      border-bottom: 1px solid rgba(154, 167, 186, .38);
      border-top: 3px solid var(--line-strong);
      grid-row: 1;
    }
    .num {
      font-weight: 800;
      font-size: calc(13px * var(--calendar-zoom));
      min-width: calc(20px * var(--calendar-density));
    }
    .badge {
      font-size: calc(10px * var(--calendar-zoom));
      line-height: 1;
      padding: calc(3px * var(--calendar-density)) calc(5px * var(--calendar-density));
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(0,0,0,.09);
      color: #364154;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(74px * var(--calendar-density));
    }
    textarea {
      width: 100%;
      border: 0;
      border-radius: 0;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: inherit;
      padding: calc(7px * var(--calendar-density));
      outline: none;
      min-height: calc(55px * var(--calendar-density));
      line-height: 1.15;
      font-size: calc(var(--day-font-size, 12px) * var(--calendar-zoom));
    }
    textarea.content { min-height: calc(58px * var(--calendar-density)); grid-row: 2; }
    textarea.problems {
      flex: 0 0 auto;
      border-top: 1px dashed rgba(101,112,131,.45);
      grid-row: 3;
      color: #38445a;
      min-height: calc(14px * var(--calendar-density));
      padding-top: calc(2px * var(--calendar-density));
      padding-bottom: calc(2px * var(--calendar-density));
      font-size: calc((var(--day-font-size, 12px) - 1px) * var(--calendar-zoom));
    }
    textarea:focus { background: rgba(255,255,255,.62); box-shadow: inset 0 0 0 2px rgba(27, 102, 95, .28); }

    .arrows { display: contents; }
    .arrow-week { display: contents; }
    .arrow-lane {
      grid-row: var(--lane-row);
      min-height: calc(24px * var(--calendar-density));
      border-left: 3px solid var(--line-strong);
      border-right: 3px solid var(--line-strong);
      background: #fbfcfe;
    }
    .arrow-lane.outside-lane { background: var(--outside); }
    .arrow-lane.weekend-lane { background: var(--weekend); }
    .arrow-lane.holiday-lane { background: var(--holiday); }
    .arrow-lane.exercise-lane { background: var(--exercise); }
    .arrow-lane.exam-lane { background: var(--exam); }
    .arrow-lane.xxx-lane { background: var(--xxx); }
    .arrow-lane.last-arrow-lane { border-bottom: 3px solid var(--line-strong); }
    .topic-arrow {
      position: relative;
      min-height: calc(22px * var(--calendar-density));
      align-self: center;
      margin: 0 14px 0 6px;
      padding: calc(4px * var(--calendar-density)) 34px calc(4px * var(--calendar-density)) 18px;
      border-radius: 4px 0 0 4px;
      color: var(--arrow-ink, #111827);
      font-size: calc(11px * var(--calendar-zoom));
      font-weight: 700;
      line-height: 1.1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--arrow-color);
      border: 1px solid rgba(0,0,0,.18);
      box-shadow: 0 1px 2px rgba(0,0,0,.12);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .topic-arrow.dragging { opacity: .78; cursor: grabbing; }
    .topic-arrow::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      bottom: 3px;
      width: 9px;
      border-radius: 2px;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 2px, rgba(0,0,0,.24) 2px 4px);
    }
    .topic-arrow.continues-before::before { display: none; }
    .topic-arrow::after {
      content: "";
      position: absolute;
      right: -13px;
      top: -1px;
      width: 0;
      height: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 13px solid var(--arrow-color);
      filter: drop-shadow(1px 0 0 rgba(0,0,0,.18));
    }
    .topic-arrow.continues-after { margin-right: 6px; border-radius: 4px; }
    .topic-arrow.continues-after::after { display: none; }
    .topic-label {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 14px;
      outline: none;
      border-radius: 3px;
      padding: 1px 18px 1px 2px;
      cursor: grab;
    }
    .topic-label[contenteditable="true"] { cursor: text; user-select: text; }
    .topic-label[contenteditable="true"]:focus { background: rgba(255,255,255,.68); box-shadow: inset 0 0 0 1px rgba(0,0,0,.24); }
    .arrow-handle {
      position: absolute;
      top: 2px;
      width: 16px;
      height: 18px;
      border: 1px solid rgba(0,0,0,.22);
      background: rgba(255,255,255,.75);
      border-radius: 4px;
      padding: 0;
      font-size: 11px;
      line-height: 1;
      cursor: ew-resize;
      z-index: 2;
    }
    .arrow-handle.left { left: -7px; }
    .arrow-handle.right { right: -3px; }
    .topic-arrow::after { pointer-events: none; }

    .context-menu {
      position: fixed;
      z-index: 80;
      min-width: 190px;
      background: white;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      box-shadow: var(--shadow);
      padding: 5px;
      display: none;
    }
    .context-menu.open { display: grid; gap: 2px; }
    .context-menu button {
      border: 0;
      border-radius: 5px;
      text-align: left;
      padding: 8px 9px;
      background: white;
      line-height: 1.15;
    }
    .context-menu button:hover { background: #eef2f8; }
    .context-menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
    .color-presets {
      display: grid;
      grid-template-columns: repeat(8, 18px);
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }
    .color-preset {
      width: 18px;
      height: 18px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 3px;
      padding: 0;
      background: var(--preset-color);
      cursor: pointer;
    }
    .context-menu .color-preset {
      padding: 0;
      background: var(--preset-color);
    }
    .color-preset:hover,
    .color-preset.active {
      outline: 2px solid var(--brand);
      outline-offset: 1px;
    }

    .drawer {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 50;
    }
    .drawer.open { display: block; }
    .shade { position: absolute; inset: 0; background: rgba(11,18,31,.34); }
    .settings {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: min(560px, 100vw);
      background: white;
      box-shadow: var(--shadow);
      padding: 18px;
      overflow: auto;
    }
    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .settings h2 { margin: 0; font-size: 18px; }
    .block { border-top: 1px solid var(--line); padding: 15px 0; }
    .block h3 { margin: 0 0 10px; font-size: 14px; }
    .checks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
    .checks label {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 5px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }
    .checks input { display: block; margin: 0 auto 4px; }
    .settings textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 150px;
      resize: vertical;
      background: #fbfcfe;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }
    .arrow-form {
      display: grid;
      grid-template-columns: 1fr 1fr 54px;
      gap: 8px;
      align-items: end;
    }
    .arrow-form label, .inline-label {
      display: grid;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .arrow-form .wide { grid-column: 1 / -1; }
    .arrow-color-tools {
      grid-column: 1 / -1;
      display: grid;
      gap: 5px;
    }
    .arrow-list {
      display: grid;
      gap: 6px;
      margin-top: 10px;
    }
    .arrow-item {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px;
      font-size: 12px;
    }
    .swatch { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.2); }
    .version-list {
      display: grid;
      gap: 6px;
      margin-top: 10px;
      max-height: 260px;
      overflow: auto;
    }
    .version-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fbfcfe;
      font-size: calc(12px * var(--calendar-zoom));
    }
    .version-item strong { display: block; font-size: 13px; }
    .version-item span { color: var(--muted); }
    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }
    .hidden-input { display: none; }

    @media (max-width: 1100px) {
      .months { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .bar-inner { grid-template-columns: 1fr; }
      .actions { justify-content: flex-start; }
      .weekdays, .week-row { grid-template-columns: repeat(5, minmax(calc(68px * var(--calendar-density)), 1fr)) repeat(2, minmax(calc(22px * var(--calendar-density)), .22fr)); }
      .month { overflow-x: auto; }
      .weekdays, .grid { min-width: calc(410px * var(--calendar-density)); }
      .week-row { min-width: calc(410px * var(--calendar-density)); }
      h1 { font-size: 17px; }
    }
  </style>
</head>

        <div>
          <h1>Calendario Matemáticas MAE NS</h1>
          <div class="subtitle" id="fileStatus">Sin archivo vinculado</div>
        </div>
      </div>
      <div class="actions">
        <select id="yearSelect" aria-label="Curso"></select>
        <label class="zoom-control" title="Zoom del calendario">
          Zoom
          <input id="zoomSlider" type="range" min="40" max="120" step="5" value="100">
          <output id="zoomValue">100%</output>
        </label>
        <button id="expandAllBtn" title="Desplegar todos los meses">Desplegar todo</button>
        <button id="selectModeBtn" title="Seleccionar días para borrado masivo">Seleccionar</button>
        <div class="selection-actions" id="selectionActions">
          <span id="selectionCount">0 días</span>
          <button id="deleteSelectedBtn" title="Borrar los días seleccionados">Borrar selección</button>
          <button id="clearSelectionBtn" title="Desmarcar todos los días">Desmarcar</button>
        </div>
        <button id="quickArrowBtn" title="Crear flecha">+ Flecha</button>
        <div class="tool-segment" aria-label="Color">
          <button data-color="blank" class="active" title="Blanco"><span class="dot blank"></span>Normal</button>
          <button data-color="exercise" title="Ejercicios"><span class="dot exercise"></span>Ejercicios</button>
          <button data-color="exam" title="Examen o corrección"><span class="dot exam"></span>Examen</button>
        </div>
        <button id="openBtn" title="Abrir archivo">Abrir</button>
        <div class="export-wrap">
          <button id="exportBtn" title="Exportar calendario">Exportar</button>
          <div class="export-menu" id="exportMenu" hidden>
            <label>Distribución
              <select id="exportLayout">
                <option value="1">Un mes por hoja</option>
                <option value="2">Dos meses por hoja</option>
              </select>
            </label>
            <button id="exportPdfBtn" type="button">PDF</button>
            <button id="exportDocxBtn" type="button">DOCX</button>
            <button id="exportExcelBtn" type="button">Excel</button>
          </div>
        </div>
        <button id="saveBtn" class="primary" title="Guardar">Guardar</button>
        <button id="settingsBtn" class="icon" title="Configuración">⚙</button>
      </div>
    </div>
  </header>

  <main>
    <div class="months" id="months"></div>
    <div class="status" id="status"></div>
  </main>

  <input class="hidden-input" id="fileInput" type="file" accept=".vconce,text/markdown,text/plain">

  <div class="context-menu" id="dayMenu" role="menu"></div>
  <div class="context-menu" id="arrowMenu" role="menu"></div>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="shade" id="shade"></div>
    <aside class="settings" aria-label="Configuración">
      <div class="settings-head">
        <h2>Configuración</h2>
        <button id="closeSettings" class="icon" title="Cerrar">×</button>
      </div>
      <div class="block">
        <h3>Días de clase</h3>
        <div class="checks" id="classDays"></div>
      </div>
      <div class="block">
        <h3>Festivos y no lectivos</h3>
        <textarea id="holidayText" spellcheck="false"></textarea>
        <div class="actions" style="justify-content:flex-start;margin-top:10px">
          <button id="applyHolidays">Aplicar</button>
          <button id="resetOfficial">Restaurar oficiales</button>
        </div>
      </div>
      <div class="block">
        <h3>Flechas de temas</h3>
        <div class="arrow-form">
          <label>Inicio <input id="arrowStart" type="date"></label>
          <label>Fin <input id="arrowEnd" type="date"></label>
          <label>Color <input id="arrowColor" type="color" value="#00b050"></label>
          <div class="arrow-color-tools">
            <span class="inline-label">Colores predefinidos</span>
            <div class="color-presets" id="arrowColorPresets"></div>
          </div>
          <label class="wide">Texto <input id="arrowText" type="text" placeholder="B1. Transferencias de energía"></label>
          <button id="addArrow" class="primary" type="button">Añadir flecha</button>
        </div>
        <div class="arrow-list" id="arrowList"></div>
      </div>
      <div class="block">
        <h3>Datos</h3>
        <div class="actions" style="justify-content:flex-start">
          <button id="newYearBtn">Vaciar curso visible</button>
          <button id="versionsBtn">Versiones</button>
          <button id="downloadBtn">Descargar copia</button>
        </div>
        <div class="version-list" id="versionList" hidden></div>
      </div>
    </aside>
  </div>

      const [sy, sm, sd] = startIso.split("-").map(Number);
      const [ey, em, ed] = endIso.split("-").map(Number);
      const end = new Date(ey, em - 1, ed);
      if (!OFFICIAL_HOLIDAYS[year]) OFFICIAL_HOLIDAYS[year] = [];
      for (let d = new Date(sy, sm - 1, sd); d <= end; d.setDate(d.getDate() + 1)) {
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        OFFICIAL_HOLIDAYS[year].push([key, label]);

    const parseIso = (s) => {
      const [y, m, d] = s.split("-").map(Number);
      return new Date(y, m - 1, d);
    };
    const mondayIndex = (d) => (d.getDay() + 6) % 7;

    function currentAcademicYear(date = new Date()) {
      const y = date.getFullYear();
      const start = date.getMonth() >= 8 ? y : y - 1;
      return `${start}-${start + 1}`;
    }

    function ensureYear(year) {
      if (!state.holidays[year]) state.holidays[year] = Object.fromEntries((OFFICIAL_HOLIDAYS[year] || []).map(([d, n]) => [d, n]));
      if (!state.entries[year]) state.entries[year] = {};
      if (!state.arrows[year]) state.arrows[year] = [];
      if (!state.collapsedMonths[year]) state.collapsedMonths[year] = state.useDefaultCollapse ? defaultCollapsedMonths(year) : {};
    }

    function defaultCollapsedMonths(year) {
      const now = new Date();
      const currentYear = currentAcademicYear(now);
      const currentMonth = now.getMonth();
      return Object.fromEntries(MONTHS.map(([, month]) => [String(month), !(year === currentYear && month === currentMonth)]));
    }

    function getYearStart(year) { return Number(year.slice(0, 4)); }

    function buildYearOptions() {
      const now = getYearStart(currentAcademicYear());
      const years = new Set([state.currentYear, ...Object.keys(state.entries || {}), ...Object.keys(state.arrows || {}), ...Object.keys(state.holidays || {})]);
      for (let y = now - 3; y <= now + 3; y++) years.add(`${y}-${y + 1}`);
      $("yearSelect").innerHTML = [...years].sort().map(y => `<option value="${y}">${y}</option>`).join("");
      $("yearSelect").value = state.currentYear;
    }

    function monthDates(academicYear, month) {
      const startYear = getYearStart(academicYear);
      const y = month >= 8 ? startYear : startYear + 1;
      const first = new Date(y, month, 1);
      const start = new Date(first);
      start.setDate(first.getDate() - mondayIndex(first));
      const last = new Date(y, month + 1, 0);
      const end = new Date(last);
      end.setDate(last.getDate() + (6 - mondayIndex(last)));
      const dates = [];
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) dates.push(new Date(d));
      return dates;
    }

    function render() {

    function renderMonthWeeks(container, dates, month) {
      for (let i = 0; i < dates.length; i += 7) {
        const week = dates.slice(i, i + 7);
        const row = document.createElement("div");
        row.className = "week-row";

        const laneCount = weekArrowLaneCount(week, month);

        for (let day = 1; day <= 7; day++) {

            const laneDate = week[day - 1];
            const laneKey = iso(laneDate);
            const laneEntry = state.entries[state.currentYear][laneKey] || {};
            const laneHoliday = state.holidays[state.currentYear][laneKey];
            const laneOutside = laneDate.getMonth() !== month;
            const slot = document.createElement("div");
            slot.className = [
              "arrow-lane",
              laneOutside && "outside-lane",
              day >= 6 && "weekend-lane",
              laneHoliday && "holiday-lane",
              laneEntry.color && `${laneEntry.color}-lane`,
              lane === laneCount && "last-arrow-lane"
            ].filter(Boolean).join(" ");
            slot.dataset.date = laneKey;
            slot.dataset.lane = String(lane);
            slot.style.gridColumn = String(day);
            slot.style.gridRow = String(3 + lane);
            slot.addEventListener("contextmenu", (event) => {
              event.preventDefault();
              event.stopPropagation();
              createBlankArrowAt(slot.dataset.date, Number(slot.dataset.lane || 1));
            });
            row.appendChild(slot);

    function weekArrowLaneCount(week, month) {
      const weekStart = iso(week[0]);

      });
      if (!visible.length) return 1;
      const restingLaneCount = Math.max(1, Math.min(3, visible.length));
      return activeArrowDrag ? Math.min(3, restingLaneCount + 1) : restingLaneCount;
    }

    function renderDay(date, month, column) {
      const key = iso(date);
      const entry = state.entries[state.currentYear][key] || {};
      const holiday = state.holidays[state.currentYear][key];
      const officialEvent = OFFICIAL_EVENTS[state.currentYear]?.[key];
      const outside = date.getMonth() !== month;
      const isWeekend = mondayIndex(date) >= 5;
      const classDay = isClassDay(date);
      const div = document.createElement("div");
      div.className = ["day", outside && "outside", isWeekend && "weekend", holiday && "holiday", !classDay && "not-class", entry.color, entry.fixed && "fixed", selectedDays.has(key) && "selected"].filter(Boolean).join(" ");

          <span class="num">${date.getDate()}</span>
          ${holiday ? `<span class="badge">${escapeHtml(holiday)}</span>` : ""}
          ${officialEvent ? `<span class="badge">${escapeHtml(officialEvent)}</span>` : ""}
          ${entry.fixed ? `<span class="badge">fijo</span>` : ""}
          ${!classDay && !holiday && !isWeekend ? `<span class="badge">sin clase</span>` : ""}
        </div>
        <textarea class="day-cell content" style="grid-column:${column};grid-row:2" data-field="content" spellcheck="true">${escapeHtml(entry.content || "")}</textarea>
        <textarea class="day-cell problems" style="grid-column:${column};grid-row:3" data-field="problems" spellcheck="true">${escapeHtml(entry.problems || "")}</textarea>`;
      div.addEventListener("click", (event) => {

          toggleDaySelection(key, event.shiftKey);

        }
        openDayMenu(key, event.clientX, event.clientY);

      div.querySelector(".day-top").addEventListener("click", (event) => {

        selectedDate = key;
        if (selectionMode) {
          toggleDaySelection(key, event.shiftKey);
          return;
        }
        openDayMenu(key, event.clientX, event.clientY);
      });
      const dayTop = div.querySelector(".day-top");

      dayTop.addEventListener("dragstart", (event) => {
        if (selectionMode) {
          event.preventDefault();
          return;
        }
        draggedDayKey = key;
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", key);
      });
      dayTop.addEventListener("dragover", (event) => {
        const source = draggedDayKey || event.dataTransfer.getData("text/plain");
        if (!source || source === key) return;
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        div.classList.add("drag-over");
      });
      dayTop.addEventListener("dragleave", () => div.classList.remove("drag-over"));
      dayTop.addEventListener("drop", (event) => {
        event.preventDefault();
        div.classList.remove("drag-over");
        const source = draggedDayKey || event.dataTransfer.getData("text/plain");
        moveDayEntry(source, key);
        draggedDayKey = null;
      });
      dayTop.addEventListener("dragend", () => {
        draggedDayKey = null;
        document.querySelectorAll(".day.drag-over").forEach(day => day.classList.remove("drag-over"));
      });
      div.querySelector(".day-select-toggle").addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        toggleDaySelection(key, event.shiftKey);
      });
      div.addEventListener("contextmenu", (event) => {
        event.preventDefault();
        selectedDate = key;
        openDayMenu(key, event.clientX, event.clientY);
      });
      div.querySelectorAll("textarea").forEach(area => {
        area.addEventListener("input", () => {
          const rec = getEntry(key);
          rec[area.dataset.field] = area.value;
          autoResize(area);
          markDirty();
        });
      });
      requestAnimationFrame(() => div.querySelectorAll("textarea").forEach(autoResize));

    function autoResize(area) {
      const density = 1;
      const baseHeight = area.classList.contains("content") ? 58 : area.classList.contains("problems") ? 14 : 42;
      area.style.height = "auto";
      area.style.height = `${Math.max(area.scrollHeight + 2, baseHeight * density)}px`;
    }

    function renderArrowSegment(row, arrow, segment) {
      const colStart = segment.startIndex + 1;
      const colEnd = segment.endIndex + 2;
      const continuesBefore = hasVisibleArrowDateBefore(arrow, segment.startDate);
      const continuesAfter = hasVisibleArrowDateAfter(arrow, segment.endDate);
      const el = document.createElement("div");
      const arrowTitle = `${arrow.text || "Flecha sin título"} (${arrow.start} - ${arrow.end})`;

      el.dataset.arrowId = arrow.id;
      el.title = arrowTitle;
      el.style.gridColumn = `${colStart} / ${colEnd}`;
      const laneCount = Math.max(1, Math.min(3, Number(row.dataset.laneCount || 1)));
      el.style.gridRow = `${3 + Math.max(1, Math.min(laneCount, Number(arrow.lane || 1)))}`;
      el.style.setProperty("--arrow-color", arrow.color || "#00b050");
      el.style.setProperty("--arrow-ink", readableInk(arrow.color || "#00b050"));
      el.innerHTML = `<button class="arrow-handle left" title="Mover inicio">|</button><span class="topic-label" contenteditable="false" spellcheck="true" title="${escapeHtml(arrowTitle)}">${escapeHtml(arrow.text || "")}</span><button class="arrow-handle right" title="Mover final">|</button>`;
      el.addEventListener("pointerdown", (event) => startArrowDrag(event, arrow.id, "move"));
      el.addEventListener("contextmenu", (event) => {

      el.addEventListener("dblclick", event => {
        event.preventDefault();
        event.stopPropagation();
        beginArrowTextEdit(label);
      });
      label.addEventListener("dblclick", event => {
        event.preventDefault();
        event.stopPropagation();
        beginArrowTextEdit(label);
      });
      label.addEventListener("input", () => {
        arrow.text = label.textContent.trim() || "Tema";
        markDirty();
      });
      label.addEventListener("keydown", event => {

          event.preventDefault();
          label.blur();
        }
      });
      label.addEventListener("blur", () => {
        arrow.text = label.textContent.trim() || "Tema";
        label.textContent = arrow.text;
        label.contentEditable = "false";
        markDirty();
      });
      el.querySelector(".left").addEventListener("pointerdown", (event) => startArrowDrag(event, arrow.id, "start"));
      el.querySelector(".right").addEventListener("pointerdown", (event) => startArrowDrag(event, arrow.id, "end"));

    function renderWeekArrows(row, week, month) {
      const arrows = (state.arrows[state.currentYear] || []).filter(a => a.start && a.end);
      const weekStart = iso(week[0]);
      const weekEnd = iso(week[6]);
      row.dataset.weekStart = weekStart;
      arrows.forEach(arrow => {
        if (arrow.end < weekStart || arrow.start > weekEnd) return;
        const visibleSegments = visibleArrowSegmentsForWeek(arrow, week, month);
        if (!visibleSegments.length) return;
        visibleSegments.forEach(segment => renderArrowSegment(row, arrow, segment));
        return;
        const start = arrow.start > weekStart ? parseIso(arrow.start) : week[0];
        const end = arrow.end < weekEnd ? parseIso(arrow.end) : week[6];
        const colStart = mondayIndex(start) + 1;
        const colEnd = mondayIndex(end) + 2;
        const hasCurrentMonth = week.some(d => d.getMonth() === month && iso(d) >= arrow.start && iso(d) <= arrow.end);
        if (!hasCurrentMonth) return;
        const continuesBefore = arrow.start < weekStart;
        const continuesAfter = arrow.end > weekEnd;
        const el = document.createElement("div");
        const arrowTitle = `${arrow.text || "Flecha sin título"} (${arrow.start} - ${arrow.end})`;
        el.className = ["topic-arrow", continuesBefore && "continues-before", continuesAfter && "continues-after"].filter(Boolean).join(" ");
        el.dataset.arrowId = arrow.id;
        el.title = arrowTitle;
        el.style.gridColumn = `${colStart} / ${colEnd}`;
        const laneCount = Math.max(1, Math.min(3, Number(row.dataset.laneCount || 1)));
        el.style.gridRow = `${3 + Math.max(1, Math.min(laneCount, Number(arrow.lane || 1)))}`;
        el.style.setProperty("--arrow-color", arrow.color || "#00b050");
        el.style.setProperty("--arrow-ink", readableInk(arrow.color || "#00b050"));
        el.innerHTML = `<button class="arrow-handle left" title="Mover inicio">|</button><span class="topic-label" contenteditable="false" spellcheck="true" title="${escapeHtml(arrowTitle)}">${escapeHtml(arrow.text || "")}</span><button class="arrow-handle right" title="Mover final">|</button>`;
        el.addEventListener("pointerdown", (event) => startArrowDrag(event, arrow.id, "move"));
        el.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          event.stopPropagation();
          openArrowMenu(arrow.id, event.clientX, event.clientY);
        });
        const label = el.querySelector(".topic-label");
        el.addEventListener("dblclick", event => {
          event.preventDefault();
          event.stopPropagation();
          beginArrowTextEdit(label);
        });
        label.addEventListener("dblclick", event => {
          event.preventDefault();
          event.stopPropagation();
          beginArrowTextEdit(label);
        });
        label.addEventListener("input", () => {
          arrow.text = label.textContent.trim() || "Tema";
          markDirty();
        });
        label.addEventListener("keydown", event => {
          if (event.key === "Enter") {
            event.preventDefault();
              label.blur();
            }
          });
        label.addEventListener("blur", () => {
          arrow.text = label.textContent.trim() || "Tema";
          label.textContent = arrow.text;
          label.contentEditable = "false";
          markDirty();
        });
        el.querySelector(".left").addEventListener("pointerdown", (event) => startArrowDrag(event, arrow.id, "start"));
        el.querySelector(".right").addEventListener("pointerdown", (event) => startArrowDrag(event, arrow.id, "end"));
        row.appendChild(el);
      });
    }

    function readableInk(hex) {
      const clean = String(hex).replace("#", "");
      if (!/^[0-9a-fA-F]{6}$/.test(clean)) return "#111827";
      const r = parseInt(clean.slice(0, 2), 16);
      const g = parseInt(clean.slice(2, 4), 16);
      const b = parseInt(clean.slice(4, 6), 16);
      return ((r * 299 + g * 587 + b * 114) / 1000) > 145 ? "#111827" : "#ffffff";
    }

    function renderArrowList() {
      ensureYear(state.currentYear);
      const startYear = getYearStart(state.currentYear);
      if (!$("arrowStart").value) $("arrowStart").value = `${startYear}-09-01`;
      if (!$("arrowEnd").value) $("arrowEnd").value = `${startYear}-09-05`;
      const list = $("arrowList");
      const arrows = state.arrows[state.currentYear].slice().sort((a, b) => a.start.localeCompare(b.start));

    function renderColorPresets(container, current, onPick) {

      container.querySelectorAll("[data-preset-color]").forEach(button => {

    function setArrowFormColor(color) {

    function addArrow() {

        id: `a-${Date.now()}-${Math.random().toString(16).slice(2)}`,

    function editArrow(id) {

      if (!arrow) return;
